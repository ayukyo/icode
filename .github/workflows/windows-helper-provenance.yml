name: Windows helper provenance

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: windows-helper-provenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.repository == 'ayukyo/icode'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - name: Check out pinned source and workflow contracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: "core.autocrlf"
          GIT_CONFIG_VALUE_0: "false"
        with:
          persist-credentials: false
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install the declared build backend for package tests
        run: python -m pip install "setuptools>=80"
      - name: Set up build-only Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: false
      - name: Verify real signed fixtures before requesting OIDC
        working-directory: native/provenance
        env:
          GOMAXPROCS: "6"
          CGO_ENABLED: "0"
          GOTOOLCHAIN: local
        run: |
          go test -mod=readonly -p 6 ./...
          go vet -mod=readonly -p 6 ./...
          python -m unittest discover -s tools -p 'test_*.py'
      - name: Validate delivery and permission contracts before requesting OIDC
        run: |
          python scripts/preflight.py
          python scripts/check_governance.py

  sign:
    needs: validate
    if: github.repository == 'ayukyo/icode' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    name: Attest and install bootstrap (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cmake-architecture: x64
            helper-architecture: x64
            python-version: "3.11"
          - os: windows-11-arm
            cmake-architecture: ARM64
            helper-architecture: arm64
            python-version: "3.11"
          - os: windows-latest
            cmake-architecture: x64
            helper-architecture: x64
            python-version: "3.12"
          - os: windows-11-arm
            cmake-architecture: ARM64
            helper-architecture: arm64
            python-version: "3.12"
    steps:
      - name: Check out trusted main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: "core.autocrlf"
          GIT_CONFIG_VALUE_0: "false"
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Require chain role diagnostic methods on this Windows signing cell
        shell: pwsh
        env:
          PYTHONPATH: src
        run: |
          @'
          import hashlib
          import os
          from pathlib import Path
          from types import ModuleType
          import unittest
          from unittest.mock import patch
          import scripts
          from scripts import probe_windows_installed_chain as current
          from scripts.run_workspace_ci import main
          from tests.test_windows_startup_pin_ci import cases
          from icode.runner import _run_unittest_with_bounded_output

          def require(condition):
              if not condition:
                  raise RuntimeError('historical_chain_role_red_failed')

          class HistoricalResult(unittest.TestResult):
              def __init__(self):
                  super().__init__()
                  self.target_failures = []

              def addFailure(self, test, error):
                  message = error[1].args[0] if type(error[1]) is AssertionError and len(error[1].args) == 1 else None
                  self.target_failures.append(
                      test.id() == target and type(message) is str
                      and message.startswith("'dacl_protected' not found in ")
                      and message.endswith(' : actual held leaf observation must emit the descriptor protected bit'))
                  super().addFailure(test, error)

          target = 'tests.test_windows_startup_native.WindowsSecurityQueryTests.test_owned_file_protected_on_off_matches_actual_chain_descriptor'
          source_ref = '1e2e4ab5d0101acf00d609af37add9893e4c57ef:scripts/probe_windows_installed_chain.py'
          source_hash = '19a9c21e204d04675e3d2c46f410afc0d4836add11843d387cf960cc3a6a2b21'
          try:
              require(os.name == 'nt')
              captured = _run_unittest_with_bounded_output(
                  ['git', 'show', source_ref], workspace=Path.cwd(), timeout=10,
                  output_limit_bytes=256 * 1024, environment=os.environ.copy())
              require(type(captured) is tuple and len(captured) == 3)
              code, raw, errors = captured
              require(type(code) is int and code == 0 and type(raw) is bytes
                      and type(errors) is bytes and not errors)
              require(hashlib.sha256(raw).hexdigest() == source_hash)
              historical = ModuleType('scripts._historical_chain_role_producer')
              historical.__file__ = source_ref
              historical.__package__ = 'scripts'
              exec(compile(raw, source_ref, 'exec'), historical.__dict__)
              suite = unittest.defaultTestLoader.loadTestsFromName(target)
              require(suite.countTestCases() == 1)
              result = HistoricalResult()
              # Only the from-scripts producer attribute changes. Native backend/SD stay real.
              with patch.object(scripts, 'probe_windows_installed_chain', historical):
                  suite.run(result)
              require(scripts.probe_windows_installed_chain is current)
              require(result.testsRun == 1 and len(result.failures) == 1
                      and result.target_failures == [True] and not result.errors
                      and not result.skipped and not result.unexpectedSuccesses)
          except BaseException:
              raise SystemExit('historical_chain_role_red_failed') from None
          print('historical-chain-role-red commit=1e2e4ab5d0101acf00d609af37add9893e4c57ef tests=1 failures=1 errors=0 skips=0 target=missing_dacl_protected')
          selections = ('tests.test_windows_installed_chain',
                        'tests.test_windows_bootstrap_binding.InstalledSourceCaptureTests',
                        'tests.test_windows_startup_native.WindowsSecurityQueryTests',
                        'tests.test_windows_startup_pin_ci')
          suites = [unittest.defaultTestLoader.loadTestsFromName(name) for name in selections]
          require(tuple(suite.countTestCases() for suite in suites) == (46, 6, 3, 14))
          ids = [case.id() for suite in suites for case in cases(suite)]
          require(len(ids) == 69 and len(set(ids)) == 69)
          for test_id in ids:
              print('chain-role-required-id=' + test_id)
          raise SystemExit(main(selections))
          '@ | python -B -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Set up build-only Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: false
      - name: Build and test matching offline verifier with original dependency notices
        shell: pwsh
        env:
          GOMAXPROCS: "6"
          CGO_ENABLED: "0"
          GOTOOLCHAIN: local
        run: |
          $verifier = Join-Path $env:RUNNER_TEMP 'icode-offline-verifier.exe'
          $notices = Join-Path $env:RUNNER_TEMP 'icode-provenance-NOTICES.txt'
          Push-Location native/provenance
          $testOutput = go test -json -mod=readonly -p 6 ./...
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            # Publish only bounded top-level test identifiers, never raw output.
            $failed = @($testOutput | ForEach-Object {
              try {
                $event = $_ | ConvertFrom-Json -ErrorAction Stop
                if ($event.Action -eq 'fail' -and $event.Test -is [string]) {
                  $name = $event.Test.Split('/')[0]
                  if ($name -cmatch '^Test[A-Za-z0-9_]{1,76}$') { $name }
                }
              } catch { }
            } | Sort-Object -Unique | Select-Object -First 16)
            $names = if ($failed.Count -eq 0) { 'unavailable' } else { $failed -join ',' }
            Write-Output "::error::offline-verifier-build stage=go_test exit=$testExit failed_tests=$names"
            exit $testExit
          }
          go vet -mod=readonly -p 6 ./...
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error::offline-verifier-build stage=go_vet exit=$LASTEXITCODE"
            exit $LASTEXITCODE
          }
          go build -mod=readonly -p 6 -trimpath -ldflags='-s -w' -o $verifier .
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error::offline-verifier-build stage=go_build exit=$LASTEXITCODE"
            exit $LASTEXITCODE
          }
          Pop-Location
          python -m unittest discover -s native/provenance/tools -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error::offline-verifier-build stage=license_tests exit=$LASTEXITCODE"
            exit $LASTEXITCODE
          }
          $noticeOutput = python native/provenance/tools/license_notices.py --output $notices 2>&1
          $noticeExit = $LASTEXITCODE
          if ($noticeExit -ne 0) {
            $reason = 'unclassified'
            $categories = @{
              'unreviewed runtime or trust anchor license' = 'runtime_or_anchor_hash'
              'missing reviewed linked module notice' = 'missing_reviewed_notice'
              'unreviewed linked module notice' = 'module_notice_hash'
              'unreviewed linked module:' = 'unknown_module'
              'missing original license' = 'missing_original_license'
              'replaced modules require' = 'module_replacement'
              'invalid or incomplete Go package list' = 'package_list'
            }
            foreach ($prefix in $categories.Keys) {
              if ($noticeOutput -match [regex]::Escape($prefix)) { $reason = $categories[$prefix]; break }
            }
            Write-Output "::error::offline-verifier-build stage=license_closure exit=$noticeExit reason=$reason"
            exit $noticeExit
          }
      - name: Build final architecture-specific bootstrap bytes
        shell: pwsh
        run: |
          $buildDirectory = Join-Path $env:RUNNER_TEMP 'icode-provenance-build'
          $verifier = Join-Path $env:RUNNER_TEMP 'icode-offline-verifier.exe'
          $python = (Get-Command python).Source
          cmake -S native/windows -B $buildDirectory -A '${{ matrix.cmake-architecture }}' -DICODE_WINDOWS_PROVENANCE_VERIFIER="$verifier" -DPython3_EXECUTABLE="$python" -DICODE_WINDOWS_BUILD_CONTEXT_DIAGNOSTIC=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build $buildDirectory --config Release --target icode_windows_bootstrap --parallel 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/probe_windows_build_context.py --build-directory $buildDirectory --architecture '${{ matrix.helper-architecture }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/probe_windows_pe_capture.py --build-directory $buildDirectory --architecture '${{ matrix.helper-architecture }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Attest exactly one final helper before building the wheel
        id: attest
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ${{ runner.temp }}/icode-provenance-build/Release/icode-sandbox-windows-${{ matrix.helper-architecture }}.exe
          push-to-registry: false
          create-storage-record: false
      - name: Verify proof transport and installed artifact cryptographically
        shell: pwsh
        env:
          PROVENANCE_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $helper = Join-Path $env:RUNNER_TEMP 'icode-provenance-build/Release/icode-sandbox-windows-${{ matrix.helper-architecture }}.exe'
          $output = Join-Path $env:RUNNER_TEMP 'icode-signed-wheels'
          $verifier = Join-Path $env:RUNNER_TEMP 'icode-offline-verifier.exe'
          $notices = Join-Path $env:RUNNER_TEMP 'icode-provenance-NOTICES.txt'
          python scripts/run_windows_wheel_ci.py --native-helper $helper --provenance-bundle $env:PROVENANCE_BUNDLE --provenance-verifier $verifier --provenance-notices $notices --wheel-output $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # CI artifacts only: no release/PyPI publishing or product execution grant.
      - name: Upload only the wheel whose installed proof verification passed
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-bootstrap-provenance-${{ matrix.helper-architecture }}-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/icode-signed-wheels/*.whl
          if-no-files-found: error
          retention-days: 14
