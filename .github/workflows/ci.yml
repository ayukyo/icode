name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      PYTHONPATH: src
    steps:
      - name: Check out the pinned source and workflow contracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: python -m compileall -q src tests scripts
      - name: Run the full unit test suite
        run: python -m unittest
      - name: Run the delivery guards
        run: python scripts/preflight.py

  workspace-platforms:
    name: R2.1 workspace (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      PYTHONPATH: src
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - name: Check out source and pinned skill
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Verify workspace and autonomous lifecycle
        run: python scripts/run_workspace_ci.py

  native-probe:
    name: R2.2 native probe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    env:
      PYTHONPATH: src
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Run actual native negative probes
        run: python scripts/run_native_probe_ci.py
      - name: Verify Linux helper denies process-group escape
        if: runner.os == 'Linux'
        run: python -m unittest tests.test_isolation.TestProbe.test_landlock_助手真实阻断文件与网络越权 -v
      - name: Verify policy command broker
        run: python -m unittest tests.test_execution_broker -v
      - name: Verify protected-path Seatbelt policy
        if: runner.os == 'macOS'
        run: python -m unittest tests.test_isolation.TestSandboxWrapping.test_seatbelt_策略profile真实阻断受保护文件与外部路径 -v
      - name: Verify minimal Seatbelt denies external private tmp reads
        if: runner.os == 'macOS'
        run: python -m unittest tests.test_isolation.TestSandboxWrapping.test_seatbelt_最小profile不读取private_tmp外部秘密 -v
      - name: Verify experimental Seatbelt policy through broker
        if: runner.os == 'macOS'
        run: python -m unittest tests.test_isolation.TestSandboxWrapping.test_seatbelt_实验策略经命令broker执行 -v
      - name: Build and verify installed Linux wheel
        if: runner.os == 'Linux'
        run: python scripts/run_native_wheel_ci.py

  presentation:
    name: Repository presentation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate website and documentation links
        run: python scripts/check_site.py
      - name: Validate repository governance
        run: python scripts/check_governance.py
