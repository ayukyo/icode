name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_legacy_appcontainer_diagnostics:
        description: Run the retired AppContainer experiments on Windows
        required: false
        default: false
        type: boolean
      run_windows_appcontainer_read_handle_probe:
        description: Run the retired AppContainer read-handle experiment (diagnostic only)
        required: false
        default: false
        type: boolean
      run_windows_standard_user_token_probe:
        description: Verify restricted-token process creation from a temporary standard Windows user
        required: false
        default: false
        type: boolean
      run_windows_standard_user_sqos_diagnostic:
        description: Compare default SQOS only after the temporary standard-user pipe open is denied
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      PYTHONPATH: src
    steps:
      - name: Check out the pinned source and workflow contracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: python -m compileall -q src tests scripts
      - name: Run the full unit test suite
        run: python -m unittest
      - name: Run the delivery guards
        run: python scripts/preflight.py

  verification-output-lifecycle:
    name: R3 verification output lifecycle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
    env:
      PYTHONPATH: src
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Verify bounded verifier output and pipe lifecycle
        shell: pwsh
        run: |
          $testExitCode = 127
          try {
            $testOutput = @(& python -m unittest tests.test_runner.TestIndependentVerification -v 2>&1)
            $testExitCode = $LASTEXITCODE
          } catch {
            $testOutput = @($_)
            $testExitCode = 127
          }
          $details = (($testOutput | Select-Object -Last 80) | ForEach-Object { [string]$_ }) -join "`n"
          if ($details.Length -gt 12000) {
            $details = $details.Substring($details.Length - 12000)
          }
          Write-Output $details
          if ($testExitCode -ne 0) {
            $annotationDetails = $details
            if ($annotationDetails.Length -gt 3000) {
              $annotationDetails = $annotationDetails.Substring(
                $annotationDetails.Length - 3000
              )
            }
            $annotationDetails = $annotationDetails.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Native lifecycle test details::$annotationDetails"
          }
          if ($testExitCode -ne 0 -and
              -not [string]::IsNullOrWhiteSpace($env:GITHUB_STEP_SUMMARY)) {
            try {
              $summary = [Net.WebUtility]::HtmlEncode($details)
              $summaryText = "## Native lifecycle test failure`n`n<pre>$summary</pre>`n"
              [IO.File]::AppendAllText(
                $env:GITHUB_STEP_SUMMARY,
                $summaryText,
                [Text.UTF8Encoding]::new($false)
              )
            } catch {
              Write-Warning 'Could not write the bounded lifecycle failure summary.'
            }
          }
          exit $testExitCode
      - name: Verify Windows process identity failure mocks
        if: runner.os == 'Windows'
        run: python -m unittest tests.test_runner.TestWindowsTestProcessHandle -v

  container-reviewer:
    name: R3 container Reviewer (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runtime: [docker, podman]
    env:
      PYTHONPATH: src
      ICODE_RUN_CONTAINER_REVIEWER_PROBE: "1"
      ICODE_CONTAINER_REVIEWER_RUNTIME: ${{ matrix.runtime }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install Podman for its native Reviewer probe
        if: matrix.runtime == 'podman'
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman
      - name: Verify Docker Engine and preload Reviewer image
        if: matrix.runtime == 'docker'
        run: |
          docker info --format '{{.ServerVersion}}'
          docker pull python:3.13-slim
      - name: Verify Podman and preload Reviewer image
        if: matrix.runtime == 'podman'
        run: |
          podman info --format json > /dev/null
          podman pull docker.io/library/python:3.13-slim
      - name: Verify native read-only Reviewer and hidden ledger boundary
        run: python -m unittest tests.test_isolation.TestSandboxWrapping.test_容器_Reviewer原生只读与账本遮蔽边界 -v

  workspace-platforms:
    name: R2.1 workspace (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, windows-11-arm]
    env:
      PYTHONPATH: src
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - name: Check out source and pinned skill
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Verify workspace and autonomous lifecycle
        run: python scripts/run_workspace_ci.py
      - name: Verify Windows R3 snapshot rejects junctions
        if: runner.os == 'Windows'
        run: python -m unittest tests.test_r3_regression.TestWindowsSnapshotReparseSafety -v
      - name: Verify leased TCP socket lifecycle
        run: python scripts/run_network_lease_ci.py

  windows-runner-pipe:
    name: R2 authenticated runner pipe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    env:
      PYTHONPATH: src
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Verify authenticated native named-pipe round trip
        run: python -m unittest tests.test_windows_runner_pipe.TestWindowsRunnerPipeNative -v

  windows-tree-snapshot-probe:
    name: R3 Windows directory and relative-open probes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    env:
      PYTHONPATH: src
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Probe directory records, handle sharing, and no-reparse relative opens
        run: python -m unittest tests.test_windows_tree_snapshot_probe -v
      - name: Verify production Windows snapshots and Git tree OID
        run: python scripts/run_windows_tree_ci.py
        env:
          ICODE_REQUIRE_WINDOWS_NATIVE_SYMLINKS: "1"

  native-probe:
    name: R2.2 native probe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, ubuntu-22.04, ubuntu-22.04-arm, macos-latest, macos-15-intel]
    env:
      PYTHONPATH: src
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Verify R3 Reviewer exact-file and hardlink read limits (macOS)
        if: runner.os == 'macOS'
        run: >-
          python -m unittest
          tests.test_tools.TestFileTools.test_精确工作区路径不能读取工作区外文件的硬链接
          tests.test_tools.TestFileTools.test_工具上下文精确读取白名单限制read_file
          tests.test_tools.TestFileTools.test_工具上下文精确读取白名单不扩展为目录grep
          -v
      - name: Diagnose Linux user-namespace host policy
        if: runner.os == 'Linux'
        shell: bash
        run: |
          printf '::notice::linux-userns uid=%s gid=%s apparmor=%s\n' "$(id -u)" "$(id -g)" "$(cat /proc/self/attr/current)"
          if test -r /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            printf '::notice::apparmor_restrict_unprivileged_userns=%s\n' "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)"
          fi
          unshare --user --map-root-user true || true
          if mapless=$(unshare --user --pid --fork sh -c 'printf "pid=%s uid=%s gid=%s\n" "$$" "$(id -u)" "$(id -g)"' 2>&1); then
            printf '::notice::mapless user+PID namespace launched: %s\n' "$mapless"
          else
            printf '::warning::mapless user+PID namespace unavailable: %s\n' "$mapless"
          fi
      - name: Install Bubblewrap for Linux Reviewer probes
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          command -v bwrap
      - name: Load the pinned Bubblewrap AppArmor profile when required
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [[ ! -r /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]] \
            || [[ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" != "1" ]]; then
            echo "::notice::AppArmor user namespace restriction is not enabled"
            exit 0
          fi
          profile_revision='b0eb95457bc2de401920308869d016e696c73664'
          profile_sha256='11d39094f044f0cda0febb3ad517b830301da6b2ce929664af09ee9e4dd264f9'
          profile_path="${RUNNER_TEMP}/bwrap-userns-restrict"
          profile_url="https://gitlab.com/apparmor/apparmor/-/raw/${profile_revision}/profiles/apparmor/profiles/extras/bwrap-userns-restrict"
          curl --fail --location --silent --show-error "${profile_url}" --output "${profile_path}"
          printf '%s  %s\n' "${profile_sha256}" "${profile_path}" | sha256sum --check
          sudo apparmor_parser --replace "${profile_path}"
          active_profiles='/sys/kernel/security/apparmor/profiles'
          if ! sudo grep -Fq 'bwrap (enforce)' "${active_profiles}"; then
            sudo cat "${active_profiles}"
            echo "::error::Pinned bwrap AppArmor profile was not loaded"
            exit 1
          fi
          bwrap_args=(--die-with-parent --unshare-user --ro-bind /usr /usr --ro-bind /bin /bin --ro-bind /lib /lib --proc /proc --dev /dev)
          if [[ -e /lib64 ]]; then
            bwrap_args+=(--ro-bind /lib64 /lib64)
          fi
          child_profile="$(bwrap "${bwrap_args[@]}" -- /bin/cat /proc/self/attr/current)"
          if [[ "${child_profile}" != *unpriv_bwrap* ]]; then
            echo "::error::Bubblewrap child did not enter the restricted AppArmor profile: ${child_profile}"
            exit 1
          fi
      - name: Verify Linux Reviewer ToolContext boundary
        if: runner.os == 'Linux'
        run: python -m unittest tests.test_isolation.TestSandboxWrapping.test_bwrap_只读Reviewer实际隐藏工单账本且阻断所有写入 -v
      - name: Verify Linux read-only Reviewer OS boundary
        if: runner.os == 'Linux'
        run: python -m unittest tests.test_isolation.TestSandboxWrapping.test_bwrap_只读Reviewer真实隐藏账本且阻断工作区内外写入 -v
      - name: Verify Linux Reviewer excluded directory replacement fails closed
        if: runner.os == 'Linux'
        run: python -m unittest tests.test_isolation.TestSandboxWrapping.test_bwrap只读Reviewer排除目录启动前替换为外部symlink不能读取 -v
      - name: Verify Linux Reviewer pinned workspace root survives path replacement
        if: runner.os == 'Linux'
        run: python -m unittest tests.test_isolation.TestSandboxWrapping.test_bwrap只读Reviewer在启动前根路径被替换仍绑定已固定目录 -v
      - name: Verify Linux policy-bound Reviewer intersection
        if: runner.os == 'Linux'
        run: python -m unittest tests.test_isolation.TestContextIntegration.test_bwrap策略化Reviewer真实拒读写入与网络 -v
        env:
          ICODE_RUN_POLICY_REVIEWER_PROBE: "1"
      - name: Verify Linux policy-bound Reviewer runner chain
        if: runner.os == 'Linux'
        run: python -m unittest tests.test_runner.TestReviewStepReadOnlyContext.test_bwrap策略化reviewer由runner派生策略并隐藏宿主账本 -v
        env:
          ICODE_RUN_POLICY_REVIEWER_PROBE: "1"
      - name: Verify mapped and mapless Linux sandbox branches
        if: runner.os == 'Linux'
        run: python -m unittest tests.test_linux_mapless -v
      - name: Run actual native negative probes
        run: python scripts/run_native_probe_ci.py
      - name: Verify test-only seccomp USER_NOTIF receipt prototype
        if: runner.os == 'Linux'
        run: python -m unittest tests.test_seccomp_notify_probe -v
      - name: Verify Linux run_command USER_NOTIF receipt integration
        if: runner.os == 'Linux'
        run: python -m unittest tests.test_linux_violation_receipt -v
      - name: Verify Linux PID namespace host-crash cleanup
        if: runner.os == 'Linux'
        run: python -m unittest tests.test_linux_pidns_cleanup -v
      - name: Verify Linux helper filesystem, network and group-independent cleanup
        if: runner.os == 'Linux'
        run: python -m unittest tests.test_isolation.TestProbe.test_landlock_助手真实阻断文件与网络越权 -v
      - name: Verify policy command broker
        run: python -m unittest tests.test_execution_broker -v
      - name: Verify leased TCP socket lifecycle
        run: python scripts/run_network_lease_ci.py
      - name: Verify protected-path Seatbelt policy
        if: runner.os == 'macOS'
        run: python -m unittest tests.test_isolation.TestSandboxWrapping.test_seatbelt_策略profile真实阻断受保护文件与外部路径 -v
      - name: Observe one controlled Seatbelt violation (diagnostic only)
        if: runner.os == 'macOS'
        run: python -m unittest tests.test_macos_violation_log_probe -v
      - name: Verify minimal Seatbelt denies external private tmp reads
        if: runner.os == 'macOS'
        run: python -m unittest tests.test_isolation.TestSandboxWrapping.test_seatbelt_最小profile不读取private_tmp外部秘密 -v
      - name: Diagnose Seatbelt localhost random-port address scope
        if: runner.os == 'macOS'
        run: python -m unittest tests.test_isolation.TestSandboxWrapping.test_seatbelt_localhost随机端口规则地址范围诊断 -v
      - name: Verify lease-bound Seatbelt AF_UNIX proxy candidate
        if: runner.os == 'macOS'
        run: python -m unittest tests.test_macos_unix_socket_probe -v
      - name: Verify read-only Reviewer hides ticket ledger
        if: runner.os == 'macOS'
        run: python -m unittest tests.test_isolation.TestSandboxWrapping.test_seatbelt_只读Reviewer真实隐藏账本且阻断工作区内外写入 -v
      - name: Verify experimental Seatbelt policy through broker
        if: runner.os == 'macOS'
        run: python -m unittest tests.test_isolation.TestSandboxWrapping.test_seatbelt_实验策略经命令broker执行 -v
      - name: Reject Seatbelt policy denies overlapping implicit read grants
        if: runner.os == 'macOS'
        run: python -m unittest tests.test_isolation.TestSandboxWrapping.test_seatbelt_策略profile拒绝与隐式运行时读根重叠的拒读路径 -v
      - name: Verify scoped macOS process-group cleanup probe
        if: runner.os == 'macOS'
        run: python -m unittest tests.test_isolation.TestProbe.test_macos_同组清理真实自检不冒充整树 -v
      - name: Verify launchd bootout known cleanup gap
        if: runner.os == 'macOS'
        run: python -m unittest tests.test_isolation.TestSandboxWrapping.test_launchd_独立作业仍未回收脱组后代 -v
      - name: Build and verify installed Linux wheel
        if: runner.os == 'Linux'
        run: python scripts/run_native_wheel_ci.py

  windows-job-probe:
    name: R2.3 Windows Job cleanup probe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    env:
      PYTHONPATH: src
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Verify R3 Reviewer exact-file and hardlink read limits
        run: >-
          python -m unittest
          tests.test_tools.TestFileTools.test_精确工作区路径不能读取工作区外文件的硬链接
          tests.test_tools.TestFileTools.test_工具上下文精确读取白名单限制read_file
          tests.test_tools.TestFileTools.test_工具上下文精确读取白名单不扩展为目录grep
          -v
      - name: Verify normal and timeout descendant cleanup
        run: python -m unittest tests.test_windows_job -v
      - name: Verify leased TCP socket lifecycle
        run: python scripts/run_network_lease_ci.py

  windows-reviewer-snapshot-probe:
    name: R3 Windows Reviewer snapshot candidate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python-architecture: x64
            cmake-architecture: x64
          - os: windows-11-arm
            python-architecture: arm64
            cmake-architecture: ARM64
    env:
      PYTHONPATH: src
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      ICODE_DIAGNOSTIC_RUNTIME_STAGING: "true"
      ICODE_DIAGNOSTIC_REVIEWER_SNAPSHOT: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          architecture: ${{ matrix.python-architecture }}
      - name: Build and self-test IPv6 loopback WFP observer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $buildDirectory = Join-Path $env:RUNNER_TEMP 'icode-reviewer-wfp-probe'
          cmake -S native/windows -B $buildDirectory -A '${{ matrix.cmake-architecture }}'
          if ($LASTEXITCODE -ne 0) { throw "WFP observer configure failed: $LASTEXITCODE" }
          cmake --build $buildDirectory --config Release --parallel 1
          if ($LASTEXITCODE -ne 0) { throw "WFP observer build failed: $LASTEXITCODE" }
          $wfpProbe = Join-Path $buildDirectory 'Release/icode-wfp-event-probe.exe'
          & $wfpProbe --self-test
          if ($LASTEXITCODE -ne 0) { throw "IPv6 WFP observer self-test failed: $LASTEXITCODE" }
          Add-Content -Path $env:GITHUB_ENV `
            -Value "ICODE_DIAGNOSTIC_WFP_PROBE_BUILD=$wfpProbe" -Encoding utf8
      - name: Cross-check Windows SDK WFP ABI (x64/ARM64)
        run: python -m unittest tests.test_windows_wfp_abi.TestWindowsWfpAbi -v
      - name: Probe WFP Subscribe2 access as runner identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $probeExecutable = $env:ICODE_DIAGNOSTIC_WFP_PROBE_BUILD
          if ([string]::IsNullOrWhiteSpace($probeExecutable) -or
              -not (Test-Path -LiteralPath $probeExecutable -PathType Leaf)) {
            throw 'runner_observer_probe_executable_missing'
          }
          $suffix = [Guid]::NewGuid().ToString('N')
          $tempRoot = [IO.Path]::GetFullPath([IO.Path]::GetTempPath())
          $observerRoot = [IO.Path]::GetFullPath(
            (Join-Path $tempRoot "icode-wfp-permission-$suffix")
          )
          $observerTempRoot = $observerRoot + [IO.Path]::DirectorySeparatorChar
          if (-not $observerRoot.StartsWith(
              $tempRoot, [StringComparison]::OrdinalIgnoreCase)) {
            throw 'runner_observer_probe_path_invalid'
          }
          if (Test-Path -LiteralPath $observerRoot) {
            throw 'runner_observer_probe_path_collision'
          }
          [IO.Directory]::CreateDirectory($observerRoot) | Out-Null
          $profileName = "icode-$suffix"
          $observerReadyPath = Join-Path $observerRoot "wfp-$suffix.ready"
          $observerStopPath = Join-Path $observerRoot "wfp-$suffix.stop"
          $observerResultPath = Join-Path $observerRoot "wfp-$suffix.json"
          $observerProcess = $null
          $observerPermissionState = 'unavailable'
          $observerReturnCode = 'none'
          $observerSetupStage = 'unavailable'
          $observerHelperExitCode = 'none'
          $observerNetworkEventsState = 'unknown'
          $runnerAdminToken = $false
          $identity = $null
          try {
            $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
            $principal = [Security.Principal.WindowsPrincipal]::new($identity)
            $runnerAdminToken = $principal.IsInRole(
              [Security.Principal.WindowsBuiltInRole]::Administrator
            )
            $startInfo = [Diagnostics.ProcessStartInfo]::new()
            $startInfo.FileName = $probeExecutable
            $startInfo.UseShellExecute = $false
            $startInfo.CreateNoWindow = $true
            $startInfo.Environment['TMP'] = $observerTempRoot
            $startInfo.Environment['TEMP'] = $observerTempRoot
            foreach ($argument in @(
              '--probe-runner-subscription', $profileName, '1',
              $observerReadyPath, $observerStopPath, $observerResultPath
            )) {
              [void]$startInfo.ArgumentList.Add([string]$argument)
            }
            $observerProcess = [Diagnostics.Process]::new()
            $observerProcess.StartInfo = $startInfo
            if (-not $observerProcess.Start()) {
              throw 'runner_observer_probe_start_failed'
            }
            $readyDeadline = [DateTimeOffset]::UtcNow.AddSeconds(5)
            while ([DateTimeOffset]::UtcNow -lt $readyDeadline) {
              $observerProcess.Refresh()
              if ((Test-Path -LiteralPath $observerReadyPath -PathType Leaf) -or
                  $observerProcess.HasExited) {
                break
              }
              Start-Sleep -Milliseconds 25
            }
            if (-not $observerProcess.HasExited -and
                -not (Test-Path -LiteralPath $observerStopPath)) {
              [IO.File]::WriteAllText(
                $observerStopPath, "stop`n", [Text.Encoding]::ASCII
              )
            }
            if (-not $observerProcess.WaitForExit(5000)) {
              try { $observerProcess.Kill() } catch { }
              if (-not $observerProcess.WaitForExit(2000)) {
                throw 'observer_permission_probe_cleanup_timeout'
              }
            }
            $observerProcess.Refresh()
            if ($observerProcess.HasExited) {
              if ($observerProcess.ExitCode -ge 0 -and
                  $observerProcess.ExitCode -le 255) {
                $observerHelperExitCode = '{0:D}' -f $observerProcess.ExitCode
              } else {
                $observerHelperExitCode = 'out_of_range'
              }
            }
            if ((Test-Path -LiteralPath $observerReadyPath -PathType Leaf) -and
                (Get-Item -LiteralPath $observerReadyPath).Length -le 64) {
              $observerSetupStage = switch -Exact -CaseSensitive (
                [IO.File]::ReadAllText($observerReadyPath)
              ) {
                "profile-create-failed`n" { 'profile_create_failed' }
                "profile-sid-invalid`n" { 'profile_sid_invalid' }
                "sid-derive-failed`n" { 'sid_derive_failed' }
                "engine-open-failed`n" { 'engine_open_failed' }
                "subscribe-failed`n" { 'subscribe_failed' }
                "classify-subscribe-failed`n" { 'classify_subscribe_failed' }
                "subscription-ready`n" { 'subscription_ready' }
                default { 'unavailable' }
              }
            }
            if ($observerProcess.ExitCode -eq 2) {
              $observerSetupStage = 'profile_cleanup_failed'
            } elseif ($observerProcess.ExitCode -eq 3) {
              $observerSetupStage = 'invalid_arguments'
            } elseif ($observerProcess.ExitCode -eq 4) {
              $observerSetupStage = 'invalid_profile_name'
            } elseif ($observerProcess.ExitCode -eq 5) {
              $observerSetupStage = 'invalid_port'
            } elseif ($observerProcess.ExitCode -eq 6) {
              $observerSetupStage = 'invalid_paths'
            } elseif ($observerProcess.ExitCode -eq 7) {
              $observerSetupStage = 'probe_path_full_path_failed'
            } elseif ($observerProcess.ExitCode -eq 8) {
              $observerSetupStage = 'probe_path_leaf_name_mismatch'
            } elseif ($observerProcess.ExitCode -eq 9) {
              $observerSetupStage = 'probe_path_temp_root_rejected'
            } elseif ($observerProcess.ExitCode -eq 10) {
              $observerSetupStage = 'probe_path_parent_mismatch'
            } elseif ($observerProcess.ExitCode -eq 11) {
              $observerSetupStage = 'probe_path_destination_not_missing'
            }
            if ((Test-Path -LiteralPath $observerResultPath -PathType Leaf) -and
                (Get-Item -LiteralPath $observerResultPath).Length -le 4096) {
              try {
                $observerReceipt = [IO.File]::ReadAllText($observerResultPath) |
                  ConvertFrom-Json -ErrorAction Stop
                $schemaVersion = $observerReceipt.schema_version
                $ipVersion = $observerReceipt.target_ip_version
                $attempted = $observerReceipt.subscription_attempted
                $returnCode = $observerReceipt.subscription_return_code
                $handlePresent = $observerReceipt.subscription_handle_present
                $subscriptionOk = $observerReceipt.subscription_ok
                $unsubscribeOk = $observerReceipt.unsubscribe_ok
                $capabilityAttempted = $observerReceipt.capability_subscription_attempted
                $capabilityReturnCode = $observerReceipt.capability_subscription_return_code
                $capabilityHandlePresent = $observerReceipt.capability_subscription_handle_present
                $capabilitySubscriptionOk = $observerReceipt.capability_subscription_ok
                $capabilityUnsubscribeOk = $observerReceipt.capability_unsubscribe_ok
                $classifyAttempted = $observerReceipt.classify_subscription_attempted
                $classifyReturnCode = $observerReceipt.classify_subscription_return_code
                $classifyHandlePresent = $observerReceipt.classify_subscription_handle_present
                $classifySubscriptionOk = $observerReceipt.classify_subscription_ok
                $classifyUnsubscribeOk = $observerReceipt.classify_unsubscribe_ok
                $observerNetworkEventsCollected = $observerReceipt.network_events_collected
                if ($observerNetworkEventsCollected -is [bool]) {
                  $observerNetworkEventsState = if ($observerNetworkEventsCollected) {
                    'enabled'
                  } else {
                    'disabled'
                  }
                }
                $capabilityReceiptValid = (
                  $capabilityAttempted -is [bool] -and $capabilityAttempted -and
                  ($capabilityReturnCode -is [int] -or $capabilityReturnCode -is [long]) -and
                  $capabilityReturnCode -ge 0 -and $capabilityReturnCode -le 4294967295 -and
                  $capabilityHandlePresent -is [bool] -and
                  $capabilitySubscriptionOk -is [bool] -and
                  $capabilityUnsubscribeOk -is [bool] -and
                  $capabilitySubscriptionOk -eq (
                    $capabilityReturnCode -eq 0 -and $capabilityHandlePresent
                  ) -and
                  (-not $capabilityHandlePresent -or $capabilityUnsubscribeOk)
                )
                $classifyReceiptValid = (
                  $classifyAttempted -is [bool] -and
                  $classifyHandlePresent -is [bool] -and
                  $classifySubscriptionOk -is [bool] -and
                  $classifyUnsubscribeOk -is [bool] -and
                  (($classifyAttempted -and
                    ($classifyReturnCode -is [int] -or $classifyReturnCode -is [long]) -and
                    $classifyReturnCode -ge 0 -and $classifyReturnCode -le 4294967295 -and
                    $classifySubscriptionOk -eq (
                      $classifyReturnCode -eq 0 -and $classifyHandlePresent
                    ) -and
                    (-not $classifyHandlePresent -or $classifyUnsubscribeOk)) -or
                   ((-not $classifyAttempted) -and $null -eq $classifyReturnCode -and
                    (-not $classifyHandlePresent) -and (-not $classifySubscriptionOk) -and
                    $classifyUnsubscribeOk))
                )
                $expectedReturnCode = $capabilityReturnCode
                if ($classifyAttempted -is [bool] -and $classifyAttempted -and
                    $classifySubscriptionOk -is [bool] -and -not $classifySubscriptionOk) {
                  $expectedReturnCode = $classifyReturnCode
                }
                if ($schemaVersion -eq 8 -and $ipVersion -eq 6 -and
                    $attempted -is [bool] -and $attempted -and
                    ($returnCode -is [int] -or $returnCode -is [long]) -and
                    $returnCode -ge 0 -and $returnCode -le 4294967295 -and
                    $returnCode -eq $expectedReturnCode -and
                    $handlePresent -is [bool] -and
                    $subscriptionOk -is [bool] -and
                    $unsubscribeOk -is [bool] -and
                    $capabilityReceiptValid -and $classifyReceiptValid -and
                    $handlePresent -eq ($capabilityHandlePresent -and $classifyHandlePresent) -and
                    $subscriptionOk -eq ($capabilitySubscriptionOk -and $classifySubscriptionOk) -and
                    $observerProcess.ExitCode -eq 0 -and $unsubscribeOk) {
                  $observerReturnCode = '0x{0:X8}' -f [uint32]$returnCode
                  if ($returnCode -eq 0 -and $handlePresent -and $subscriptionOk -and
                      $capabilitySubscriptionOk -and $classifySubscriptionOk) {
                    $observerPermissionState = 'subscription_succeeded'
                  } elseif ($capabilityReturnCode -eq 5 -and
                      -not $capabilityHandlePresent -and -not $capabilitySubscriptionOk) {
                    $observerPermissionState = 'access_denied'
                  } else {
                    $observerPermissionState = 'subscription_failed'
                  }
                }
              } catch {
                $observerPermissionState = 'unavailable'
              }
            }
          } finally {
            if ($identity) { $identity.Dispose() }
            if ($observerProcess) {
              $observerProcess.Refresh()
              if (-not $observerProcess.HasExited) {
                try {
                  [IO.File]::WriteAllText(
                    $observerStopPath, "stop`n", [Text.Encoding]::ASCII
                  )
                } catch { }
                if (-not $observerProcess.WaitForExit(5000)) {
                  try { $observerProcess.Kill() } catch { }
                  if (-not $observerProcess.WaitForExit(2000)) {
                    $observerProcess.Dispose()
                    throw 'observer_permission_probe_cleanup_timeout'
                  }
                }
              }
              $observerProcess.Dispose()
            }
            if (Test-Path -LiteralPath $observerRoot -PathType Container) {
              Remove-Item -LiteralPath $observerRoot -Recurse -Force -ErrorAction Stop
            }
          }
          Write-Output "::notice title=WFP observer identity control::runner_admin_token=$runnerAdminToken runner_wfp_observer_permission_probe=$observerPermissionState runner_wfp_observer_setup=$observerSetupStage runner_wfp_observer_helper_exit_code=$observerHelperExitCode runner_wfp_network_events_collected=$observerNetworkEventsState subscription_return_code=$observerReturnCode"
      - name: Run Reviewer snapshot probe as temporary standard user
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $suffix = [Guid]::NewGuid().ToString('N').Substring(0, 8)
          $accountName = "icodeprobe_$suffix"
          if ($accountName.Length -gt 20) { throw 'temporary_reviewer_account_name_too_long' }
          $probeRoot = Join-Path $env:RUNNER_TEMP "icode-reviewer-standard-user-$suffix"
          $wfpProbeForUser = Join-Path $probeRoot 'icode-wfp-event-probe.exe'
          $wfpCapturePrefix = Join-Path $env:RUNNER_TEMP "icode-reviewer-wfp-$suffix"
          $wfpCaptureArchive = "$wfpCapturePrefix.cab"
          $wfpExtractRoot = Join-Path $env:RUNNER_TEMP "icode-reviewer-wfp-extract-$suffix"
          $wfpExtractExplicitFile = Join-Path $wfpExtractRoot 'wfpdiag.xml'
          $wfpMemberSelfTestRoot = Join-Path $env:RUNNER_TEMP "icode-wfp-member-selftest-$suffix"
          $wfpMemberSelfTestSource = Join-Path $wfpMemberSelfTestRoot 'wfpdiag.xml'
          $wfpMemberSelfTestCab = Join-Path $wfpMemberSelfTestRoot 'member-selftest.cab'
          $wfpMemberSelfTestExtractRoot = Join-Path $wfpMemberSelfTestRoot 'extract-exact-directory'
          $wfpMemberSelfTestWildcardExtractRoot = Join-Path $wfpMemberSelfTestRoot 'extract-wildcard-directory'
          $wfpMemberSelfTestExplicitExtractFile = Join-Path $wfpMemberSelfTestRoot 'extract-exact-file.xml'
          $python = (Get-Command python).Source
          $cabinetMemberProbe = Join-Path $env:GITHUB_WORKSPACE 'scripts/inspect_windows_cabinet_members.py'
          $wfpMatchFile = Join-Path $probeRoot 'wfp-match.json'
          $wfpRunnerTargetFile = Join-Path $probeRoot 'wfp-runner-target.json'
          $wfpRunnerReadyFile = Join-Path $probeRoot 'wfp-runner-observer.ready'
          $wfpCaptureStarted = $false
          $wfpCaptureStartAttempted = $false
          $wfpCaptureStatus = 'not_started'
          $wfpCapturePreflight = 'not_checked'
          $wfpArchiveMemberStatus = 'not_checked'
          $wfpArchiveMemberCount = 'not_checked'
          $wfpArchiveMemberMatchCount = 'not_checked'
          $wfpArchiveXmlMemberCount = 'not_checked'
          $wfpArchiveWfpdiagXmlMemberCount = 'not_checked'
          $wfpExactDropCount = 0
          $wfpExtractExitCode = 'not_run'
          $wfpMemberSelfTestStage = 'prepare'
          $runnerWfpObserverRoot = $null
          $runnerWfpObserverProcess = $null
          $runnerWfpObserverReadyPath = $null
          $runnerWfpObserverStopPath = $null
          $runnerWfpObserverResultPath = $null
          $runnerWfpObserverStatus = 'not_started'
          $runnerWfpObserverMarkerState = 'not_started'
          $runnerWfpObserverProcessState = 'not_started'
          $runnerWfpObserverHelperExitCode = 'not_exited'
          $runnerWfpObserverPreflightState = 'not_checked'
          $runnerWfpReceiptState = 'not_checked'
          $runnerWfpCollectionState = 'unknown'
          $runnerWfpCandidateEvent = 'inconclusive'
          $runnerWfpMatchedCapabilityDropCount = 'not_checked'
          $runnerWfpMatchedClassifyDropCount = 'not_checked'
          $runnerWfpHistoryCapability = 'not_checked'
          $runnerWfpHistoryClassify = 'not_checked'
          $runnerWfpCleanupState = 'not_started'
          $netsh = Join-Path $env:SystemRoot 'System32/netsh.exe'
          $profilePath = $null
          $securePassword = $null
          $passwordText = $null
          $created = $false
          $environmentNames = @(
            'HOME', 'USERPROFILE', 'HOMEDRIVE', 'HOMEPATH',
            'RUNNER_TEMP', 'TEMP', 'TMP', 'ICODE_DIAGNOSTIC_STANDARD_USER_SID',
            'ICODE_DIAGNOSTIC_WFP_PROBE_PATH', 'ICODE_DIAGNOSTIC_WFP_CAPTURE',
            'ICODE_DIAGNOSTIC_WFP_MATCH_FILE',
            'ICODE_DIAGNOSTIC_WFP_RUNNER_TARGET_FILE',
            'ICODE_DIAGNOSTIC_WFP_RUNNER_READY_FILE'
          )
          $savedEnvironment = @{}
          foreach ($name in $environmentNames) {
            $savedEnvironment[$name] = [Environment]::GetEnvironmentVariable($name, 'Process')
          }
          function Invoke-BoundedDiagnosticCommand {
            param(
              [Parameter(Mandatory = $true)][string]$Path,
              [Parameter(Mandatory = $true)][string[]]$Arguments,
              [Parameter(Mandatory = $true)][ValidateRange(1, 60000)][int]$TimeoutMilliseconds,
              [switch]$CaptureStdout,
              [switch]$CaptureStderr
            )
            $process = $null
            $started = $false
            try {
              $startInfo = [Diagnostics.ProcessStartInfo]::new()
              $startInfo.FileName = $Path
              $startInfo.UseShellExecute = $false
              $startInfo.CreateNoWindow = $true
              $startInfo.RedirectStandardOutput = $true
              $startInfo.RedirectStandardError = $true
              foreach ($argument in $Arguments) {
                [void]$startInfo.ArgumentList.Add($argument)
              }
              $process = [Diagnostics.Process]::new()
              $process.StartInfo = $startInfo
              if (-not $process.Start()) {
                return [pscustomobject]@{
                  ExitCode = $null; TimedOut = $false; Stdout = ''; Stderr = ''
                }
              }
              $started = $true
              if ($CaptureStdout) {
                $stdoutTask = $process.StandardOutput.ReadToEndAsync()
              } else {
                $stdoutTask = $process.StandardOutput.BaseStream.CopyToAsync([IO.Stream]::Null)
              }
              if ($CaptureStderr) {
                $stderrTask = $process.StandardError.ReadToEndAsync()
              } else {
                $stderrTask = $process.StandardError.BaseStream.CopyToAsync([IO.Stream]::Null)
              }
              if (-not $process.WaitForExit($TimeoutMilliseconds)) {
                try { $process.Kill($true) } catch { }
                [void]$process.WaitForExit(5000)
                return [pscustomobject]@{
                  ExitCode = $null; TimedOut = $true; Stdout = ''; Stderr = ''
                }
              }
              # Child exit does not guarantee inherited stdout/stderr handles reached EOF.
              # Keep pipe drains bounded too, and fail closed if parser output is incomplete.
              if ($CaptureStdout) {
                if (-not $stdoutTask.Wait(5000)) {
                  try { $process.StandardOutput.Close() } catch { }
                  try { [void]$stdoutTask.Wait(1000) } catch { }
                  try { $process.StandardError.Close() } catch { }
                  try { [void]$stderrTask.Wait(1000) } catch { }
                  return [pscustomobject]@{
                    ExitCode = $process.ExitCode; TimedOut = $false; Stdout = ''; Stderr = ''
                  }
                }
                $stdout = $stdoutTask.Result
              } else {
                if (-not $stdoutTask.Wait(1000)) {
                  try { $process.StandardOutput.Close() } catch { }
                  try { [void]$stdoutTask.Wait(1000) } catch { }
                }
                $stdout = ''
              }
              $stderr = ''
              if ($CaptureStderr) {
                if (-not $stderrTask.Wait(5000)) {
                  try { $process.StandardError.Close() } catch { }
                  try { [void]$stderrTask.Wait(1000) } catch { }
                } else {
                  $stderr = $stderrTask.Result
                }
              } else {
                try {
                  if (-not $stderrTask.Wait(1000)) {
                    $process.StandardError.Close()
                    try { [void]$stderrTask.Wait(1000) } catch { }
                  }
                } catch {
                  try { $process.StandardError.Close() } catch { }
                }
              }
              return [pscustomobject]@{
                ExitCode = $process.ExitCode; TimedOut = $false; Stdout = $stdout; Stderr = $stderr
              }
            } catch {
              if ($started -and $process -and -not $process.HasExited) {
                try { $process.Kill($true) } catch { }
                try { [void]$process.WaitForExit(5000) } catch { }
              }
              return [pscustomobject]@{
                ExitCode = $null; TimedOut = $false; Stdout = ''; Stderr = ''
              }
            } finally {
              if ($process) { $process.Dispose() }
            }
          }
          function Get-WfpCaptureActivity {
            param([Parameter(Mandatory = $true)][string]$Output)
            if ($Output -match '(?im)\b(?:No capture is in progress|No active capture)\b') {
              return 'inactive'
            }
            if ($Output -match '(?im)\b(?:Capture is already in progress|Capture is active)\b') {
              return 'active'
            }
            return 'unknown'
          }
          try {
            $wfpMemberSelfTestStage = 'prepare'
            New-Item -ItemType Directory -Path $wfpMemberSelfTestRoot | Out-Null
            $wfpMemberSelfTestContent = 'ICODE synthetic CAB member parser self-test'
            [IO.File]::WriteAllText(
              $wfpMemberSelfTestSource,
              $wfpMemberSelfTestContent,
              [Text.Encoding]::ASCII
            )
            $makecab = Join-Path $env:SystemRoot 'System32/makecab.exe'
            $expand = Join-Path $env:SystemRoot 'System32/expand.exe'
            $wfpMemberSelfTestStage = 'makecab'
            $makecabResult = Invoke-BoundedDiagnosticCommand `
              -Path $makecab -Arguments @(
                $wfpMemberSelfTestSource, $wfpMemberSelfTestCab
              ) -TimeoutMilliseconds 5000
            if ($makecabResult.TimedOut -or $makecabResult.ExitCode -ne 0 -or
                -not (Test-Path -LiteralPath $wfpMemberSelfTestCab -PathType Leaf)) {
              throw 'wfp_cab_member_parser_self_test_failed'
            }
            $wfpMemberSelfTestStage = 'member_enumeration'
            $memberListResult = Invoke-BoundedDiagnosticCommand `
              -Path $python -Arguments @(
                $cabinetMemberProbe, '--archive', $wfpMemberSelfTestCab
              ) -TimeoutMilliseconds 5000 -CaptureStdout
            if ($memberListResult.TimedOut -or $memberListResult.ExitCode -ne 0) {
              throw 'wfp_cab_member_parser_self_test_failed'
            }
            $cabinetMemberSummary = $memberListResult.Stdout | ConvertFrom-Json
            if ($cabinetMemberSummary.schema_version -ne 3 -or
                $cabinetMemberSummary.status -ne 'listed' -or
                ($cabinetMemberSummary.member_count -isnot [int] -and
                 $cabinetMemberSummary.member_count -isnot [long]) -or
                $cabinetMemberSummary.member_count -lt 1 -or
                $cabinetMemberSummary.member_count -gt 4096 -or
                ($cabinetMemberSummary.target_match_count -isnot [int] -and
                 $cabinetMemberSummary.target_match_count -isnot [long]) -or
                $cabinetMemberSummary.target_match_count -ne 1 -or
                $cabinetMemberSummary.target_match_count -gt $cabinetMemberSummary.member_count -or
                ($cabinetMemberSummary.xml_member_count -isnot [int] -and
                 $cabinetMemberSummary.xml_member_count -isnot [long]) -or
                $cabinetMemberSummary.xml_member_count -ne 1 -or
                $cabinetMemberSummary.xml_member_count -gt $cabinetMemberSummary.member_count -or
                $cabinetMemberSummary.target_match_count -gt $cabinetMemberSummary.xml_member_count -or
                ($cabinetMemberSummary.wfpdiag_prefixed_xml_member_count -isnot [int] -and
                 $cabinetMemberSummary.wfpdiag_prefixed_xml_member_count -isnot [long]) -or
                $cabinetMemberSummary.wfpdiag_prefixed_xml_member_count -ne 1 -or
                $cabinetMemberSummary.wfpdiag_prefixed_xml_member_count -gt $cabinetMemberSummary.xml_member_count -or
                $cabinetMemberSummary.target_match_count -gt $cabinetMemberSummary.wfpdiag_prefixed_xml_member_count) {
              throw 'wfp_cab_member_parser_self_test_failed'
            }
            $wfpMemberSelfTestStage = 'member_match'
            $wfpMemberSelfTestStage = 'extract'
            New-Item -ItemType Directory -Path $wfpMemberSelfTestExtractRoot | Out-Null
            New-Item -ItemType Directory -Path $wfpMemberSelfTestWildcardExtractRoot | Out-Null
            $syntheticExactDirectoryResult = Invoke-BoundedDiagnosticCommand `
              -Path $expand -Arguments @(
                $wfpMemberSelfTestCab, '-F:wfpdiag.xml', $wfpMemberSelfTestExtractRoot
              ) -TimeoutMilliseconds 5000 -CaptureStdout -CaptureStderr
            $syntheticExactFileResult = Invoke-BoundedDiagnosticCommand `
              -Path $expand -Arguments @(
                $wfpMemberSelfTestCab, '-F:wfpdiag.xml', $wfpMemberSelfTestExplicitExtractFile
              ) -TimeoutMilliseconds 5000 -CaptureStdout -CaptureStderr
            $syntheticWildcardDirectoryResult = Invoke-BoundedDiagnosticCommand `
              -Path $expand -Arguments @(
                $wfpMemberSelfTestCab, '-F:*', $wfpMemberSelfTestWildcardExtractRoot
              ) -TimeoutMilliseconds 5000 -CaptureStdout -CaptureStderr
            $syntheticExactDirectoryCandidates = @(
              Get-ChildItem -LiteralPath $wfpMemberSelfTestExtractRoot `
                -Filter 'wfpdiag.xml' -File -Recurse -Force -ErrorAction Stop
            )
            $syntheticWildcardDirectoryCandidates = @(
              Get-ChildItem -LiteralPath $wfpMemberSelfTestWildcardExtractRoot `
                -Filter 'wfpdiag.xml' -File -Recurse -Force -ErrorAction Stop
            )
            $syntheticExactDirectoryStatus = if ($syntheticExactDirectoryResult.TimedOut) {
              'timeout'
            } elseif ($syntheticExactDirectoryResult.ExitCode -ne 0) {
              'command_failed'
            } elseif ($syntheticExactDirectoryCandidates.Count -eq 0) {
              'zero'
            } elseif ($syntheticExactDirectoryCandidates.Count -eq 1) {
              'one'
            } else {
              'multiple'
            }
            $syntheticExactFileExists = Test-Path -LiteralPath $wfpMemberSelfTestExplicitExtractFile -PathType Leaf
            $syntheticExactFileStatus = if ($syntheticExactFileResult.TimedOut) {
              'timeout'
            } elseif ($syntheticExactFileResult.ExitCode -ne 0) {
              'command_failed'
            } elseif ($syntheticExactFileExists) {
              'one'
            } else {
              'zero'
            }
            $syntheticWildcardDirectoryStatus = if ($syntheticWildcardDirectoryResult.TimedOut) {
              'timeout'
            } elseif ($syntheticWildcardDirectoryResult.ExitCode -ne 0) {
              'command_failed'
            } elseif ($syntheticWildcardDirectoryCandidates.Count -eq 0) {
              'zero'
            } elseif ($syntheticWildcardDirectoryCandidates.Count -eq 1) {
              'one'
            } else {
              'multiple'
            }
            $syntheticExactStdoutMember = if ([regex]::IsMatch(
              $syntheticExactDirectoryResult.Stdout, '(?i)wfpdiag\.xml'
            )) { 'true' } else { 'false' }
            $syntheticExactStderrMember = if ([regex]::IsMatch(
              $syntheticExactDirectoryResult.Stderr, '(?i)wfpdiag\.xml'
            )) { 'true' } else { 'false' }
            $syntheticXmlCandidates = @()
            if ($syntheticExactDirectoryStatus -eq 'one') {
              $wfpMemberSelfTestExtractMode = 'directory'
              $wfpSyntheticExtract = $syntheticExactDirectoryResult
              $syntheticXmlCandidates = $syntheticExactDirectoryCandidates
            } elseif ($syntheticExactFileStatus -eq 'one') {
              $wfpMemberSelfTestExtractMode = 'file'
              $wfpSyntheticExtract = $syntheticExactFileResult
              $syntheticXmlCandidates = @(
                Get-Item -LiteralPath $wfpMemberSelfTestExplicitExtractFile -ErrorAction Stop
              )
            } else {
              $wfpSyntheticExtract = $syntheticExactDirectoryResult
            }
            $extractTimedOut = if ($wfpSyntheticExtract.TimedOut) { 'true' } else { 'false' }
            $extractExitCode = if ($null -eq $wfpSyntheticExtract.ExitCode) {
              'unknown'
            } else {
              [string]$wfpSyntheticExtract.ExitCode
            }
            $syntheticXmlCandidateCount = if ($syntheticXmlCandidates.Count -eq 0) {
              'zero'
            } elseif ($syntheticXmlCandidates.Count -eq 1) {
              'one'
            } else {
              'multiple'
            }
            if ($wfpSyntheticExtract.TimedOut -or $wfpSyntheticExtract.ExitCode -ne 0 -or
                $syntheticXmlCandidates.Count -ne 1) {
              Write-Output "wfp_cab_member_parser_self_test_extract=failed timed_out=$extractTimedOut exit_code=$extractExitCode xml_candidates=$syntheticXmlCandidateCount synthetic_exact_directory_file=$syntheticExactDirectoryStatus synthetic_exact_file_file=$syntheticExactFileStatus synthetic_wildcard_directory_file=$syntheticWildcardDirectoryStatus synthetic_exact_stdout_member=$syntheticExactStdoutMember synthetic_exact_stderr_member=$syntheticExactStderrMember"
              throw 'wfp_cab_member_parser_self_test_failed'
            }
            $wfpMemberSelfTestStage = 'content_check'
            $syntheticContentMatches = [IO.File]::ReadAllText($syntheticXmlCandidates[0].FullName) -ceq $wfpMemberSelfTestContent
            if (-not $syntheticContentMatches) {
              throw 'wfp_cab_member_parser_self_test_failed'
            }
            Write-Output "wfp_cab_member_parser_self_test=passed extraction_mode=$wfpMemberSelfTestExtractMode"
          } catch {
            Write-Output "wfp_cab_member_parser_self_test=failed stage=$wfpMemberSelfTestStage"
            throw 'wfp_cab_member_parser_self_test_failed'
          } finally {
            if (Test-Path -LiteralPath $wfpMemberSelfTestRoot) {
              try {
                Remove-Item -LiteralPath $wfpMemberSelfTestRoot -Recurse -Force -ErrorAction Stop
              } catch {
                throw 'wfp_cab_member_parser_self_test_cleanup_failed'
              }
            }
          }
          try {
            $passwordBytes = [Security.Cryptography.RandomNumberGenerator]::GetBytes(32)
            $passwordText = [Convert]::ToBase64String($passwordBytes).TrimEnd('=') + 'aA1!'
            Write-Output "::add-mask::$passwordText"
            [Array]::Clear($passwordBytes, 0, $passwordBytes.Length)
            $securePassword = ConvertTo-SecureString -String $passwordText -AsPlainText -Force
            $credential = [Management.Automation.PSCredential]::new($accountName, $securePassword)

            New-LocalUser -Name $accountName -Password $securePassword `
              -PasswordNeverExpires -AccountNeverExpires | Out-Null
            $created = $true
            $sid = (Get-LocalUser -Name $accountName).SID.Value
            $adminSids = Get-LocalGroupMember -Group 'Administrators' |
              ForEach-Object { $_.SID.Value }
            if ($adminSids -contains $sid) {
              throw 'temporary_reviewer_account_is_admin'
            }

            New-Item -ItemType Directory -Path $probeRoot | Out-Null
            & icacls.exe $probeRoot /grant "*${sid}:(OI)(CI)M" /Q
            if ($LASTEXITCODE -ne 0) { throw "reviewer_probe_root_acl_failed exit=$LASTEXITCODE" }
            Copy-Item -LiteralPath $env:ICODE_DIAGNOSTIC_WFP_PROBE_BUILD `
              -Destination $wfpProbeForUser -ErrorAction Stop

            $profileBootstrap = Start-Process `
              -FilePath (Join-Path $env:SystemRoot 'System32/cmd.exe') `
              -ArgumentList @('/d', '/c', 'exit', '0') `
              -Credential $credential -LoadUserProfile `
              -WorkingDirectory (Join-Path $env:SystemRoot 'System32') `
              -PassThru
            # PowerShell's Start-Process -Wait has no local deadline; bound the profile bootstrap.
            if (-not $profileBootstrap.WaitForExit(30000)) {
              try { $profileBootstrap.Kill($true) } catch { }
              if (-not $profileBootstrap.WaitForExit(5000)) {
                throw 'temporary_user_profile_bootstrap_cleanup_timeout'
              }
              throw 'temporary_user_profile_bootstrap_timeout'
            }
            $profileBootstrap.Refresh()
            if ($profileBootstrap.ExitCode -ne 0) {
              throw "temporary_user_profile_bootstrap_failed exit=$($profileBootstrap.ExitCode)"
            }
            $profiles = @(Get-CimInstance -ClassName Win32_UserProfile -Filter "SID = '$sid'")
            if ($profiles.Count -ne 1 -or [string]::IsNullOrWhiteSpace($profiles[0].LocalPath)) {
              throw 'temporary_user_profile_path_unavailable'
            }
            $profilePath = [string]$profiles[0].LocalPath
            if (-not [IO.Path]::IsPathRooted($profilePath) -or
                -not (Test-Path -LiteralPath $profilePath -PathType Container)) {
              throw 'temporary_user_profile_path_invalid'
            }

            $arguments = @(
              '-m', 'unittest',
              'tests.test_windows_appcontainer.TestWindowsAppContainer.test_Reviewer快照AppContainer只读边界与Job清理',
              '-v'
            )
            $profileVolumeRoot = [IO.Path]::GetPathRoot($profilePath)
            $env:HOME = $profilePath
            $env:USERPROFILE = $profilePath
            $env:HOMEDRIVE = $profileVolumeRoot.TrimEnd('\')
            $env:HOMEPATH = $profilePath.Substring($env:HOMEDRIVE.Length)
            $env:RUNNER_TEMP = $probeRoot
            $env:TEMP = $probeRoot
            $env:TMP = $probeRoot
            $env:ICODE_DIAGNOSTIC_STANDARD_USER_SID = $sid
            $env:ICODE_DIAGNOSTIC_WFP_PROBE_PATH = $wfpProbeForUser
            $env:ICODE_DIAGNOSTIC_WFP_CAPTURE = 'true'
            $env:ICODE_DIAGNOSTIC_WFP_MATCH_FILE = $wfpMatchFile
            $env:ICODE_DIAGNOSTIC_WFP_RUNNER_TARGET_FILE = $wfpRunnerTargetFile
            $env:ICODE_DIAGNOSTIC_WFP_RUNNER_READY_FILE = $wfpRunnerReadyFile

            $stdout = Join-Path $probeRoot 'reviewer-probe.stdout.txt'
            $stderr = Join-Path $probeRoot 'reviewer-probe.stderr.txt'
            $captureStatusResult = Invoke-BoundedDiagnosticCommand `
              -Path $netsh -Arguments @('wfp', 'capture', 'status') `
              -TimeoutMilliseconds 5000 -CaptureStdout -CaptureStderr
            if (-not $captureStatusResult.TimedOut -and $captureStatusResult.ExitCode -eq 0) {
              $captureStatusOutput = $captureStatusResult.Stdout + "`n" + $captureStatusResult.Stderr
              $wfpCapturePreflight = Get-WfpCaptureActivity $captureStatusOutput
              if ($wfpCapturePreflight -eq 'inactive') {
                $wfpCaptureStartAttempted = $true
                $captureStartResult = Invoke-BoundedDiagnosticCommand `
                  -Path $netsh -Arguments @(
                    'wfp', 'capture', 'start', 'keywords=19', 'cab=on',
                    'traceonly=off', "file=$wfpCapturePrefix"
                  ) -TimeoutMilliseconds 10000
                if (-not $captureStartResult.TimedOut -and $captureStartResult.ExitCode -eq 0) {
                  $wfpCaptureStarted = $true
                  $wfpCaptureStatus = 'started'
                } elseif ($captureStartResult.TimedOut) {
                  $wfpCaptureStatus = 'start_timeout'
                } else {
                  $wfpCaptureStatus = 'start_failed'
                }
              } elseif ($wfpCapturePreflight -eq 'active') {
                $wfpCaptureStatus = 'existing_session'
              } else {
                $wfpCaptureStatus = 'status_unrecognized'
              }
            } elseif ($captureStatusResult.TimedOut) {
              $wfpCapturePreflight = 'timeout'
              $wfpCaptureStatus = 'status_timeout'
            } else {
              $wfpCapturePreflight = 'failed'
              $wfpCaptureStatus = 'status_failed'
            }
            $process = Start-Process -FilePath $python -ArgumentList $arguments `
              -Credential $credential -LoadUserProfile `
              -WorkingDirectory $env:GITHUB_WORKSPACE `
              -RedirectStandardOutput $stdout -RedirectStandardError $stderr `
              -PassThru

            # Wait for one exact target tuple from the standard-user test, then
            # observe it from the runner token. The test stages its Python runtime
            # before publishing the tuple, so allow a bounded 30-second window.
            $runnerTargetContext = $null
            $runnerWfpTargetContextState = 'waiting'
            $runnerTargetDeadline = [DateTimeOffset]::UtcNow.AddSeconds(30)
            while ([DateTimeOffset]::UtcNow -lt $runnerTargetDeadline) {
              $process.Refresh()
              if ($process.HasExited) {
                $runnerWfpTargetContextState = 'process_exited_before_target'
                break
              }
              if (Test-Path -LiteralPath $wfpRunnerTargetFile -PathType Leaf) {
                $targetLength = -1
                try {
                  $targetLength = (Get-Item -LiteralPath $wfpRunnerTargetFile).Length
                } catch {
                  $runnerWfpTargetContextState = 'read_failed'
                }
                if ($targetLength -eq 0) {
                  $runnerWfpTargetContextState = 'empty'
                } elseif ($targetLength -gt 512) {
                  $runnerWfpTargetContextState = 'oversize'
                } elseif ($targetLength -gt 0 -and
                          $runnerWfpTargetContextState -ne 'read_failed') {
                  $targetText = $null
                  try {
                    $targetText = [IO.File]::ReadAllText($wfpRunnerTargetFile)
                  } catch {
                    $runnerWfpTargetContextState = 'read_failed'
                  }
                  if ($null -ne $targetText) {
                    $candidateTarget = $null
                    try {
                      $candidateTarget = $targetText | ConvertFrom-Json -ErrorAction Stop
                    } catch {
                      $runnerWfpTargetContextState = 'invalid_json'
                    }
                    if ($null -ne $candidateTarget) {
                      $targetPropertyNames = @(
                        $candidateTarget.PSObject.Properties.Name | Sort-Object -CaseSensitive
                      )
                      $expectedTargetPropertyNames = @(
                        'profile_name', 'remote_address', 'remote_port', 'version' |
                          Sort-Object -CaseSensitive
                      )
                      $targetPropertiesMatch = (
                        $targetPropertyNames.Count -eq $expectedTargetPropertyNames.Count
                      )
                      foreach ($propertyName in $expectedTargetPropertyNames) {
                        if ($targetPropertyNames -notcontains $propertyName) {
                          $targetPropertiesMatch = $false
                        }
                      }
                      if ($targetPropertiesMatch -and
                          ($candidateTarget.version -is [int] -or
                           $candidateTarget.version -is [long]) -and
                          $candidateTarget.version -eq 1 -and
                          $candidateTarget.profile_name -is [string] -and
                          $candidateTarget.profile_name -cmatch '^icode-[0-9a-f]{32}$' -and
                          $candidateTarget.remote_address -is [string] -and
                          $candidateTarget.remote_address -ceq '::1' -and
                          ($candidateTarget.remote_port -is [int] -or
                           $candidateTarget.remote_port -is [long]) -and
                          $candidateTarget.remote_port -ge 1 -and
                          $candidateTarget.remote_port -le 65535) {
                        $runnerTargetContext = $candidateTarget
                        $runnerWfpTargetContextState = 'valid'
                        break
                      }
                      $runnerWfpTargetContextState = 'invalid_fields'
                    } elseif ($runnerWfpTargetContextState -ne 'invalid_json') {
                      $runnerWfpTargetContextState = 'invalid_fields'
                    }
                  }
                }
              }
              Start-Sleep -Milliseconds 25
            }
            if ($null -eq $runnerTargetContext -and
                $runnerWfpTargetContextState -eq 'waiting') {
              $runnerWfpTargetContextState = 'wait_timeout'
            }

            if ($null -ne $runnerTargetContext) {
              $runnerWfpObserverStatus = 'unavailable'
              try {
                $probeExecutable = $env:ICODE_DIAGNOSTIC_WFP_PROBE_BUILD
                if ([string]::IsNullOrWhiteSpace($probeExecutable) -or
                    -not (Test-Path -LiteralPath $probeExecutable -PathType Leaf)) {
                  $runnerWfpObserverStatus = 'probe_missing'
                  $runnerWfpObserverMarkerState = 'probe_missing'
                } else {
                  $observerTempRoot = [IO.Path]::GetFullPath([IO.Path]::GetTempPath())
                  $observerSuffix = [Guid]::NewGuid().ToString('N')
                  $runnerWfpObserverRoot = [IO.Path]::GetFullPath(
                    (Join-Path $observerTempRoot "icode-wfp-candidate-$observerSuffix")
                  )
                  $observerContainmentRoot = $observerTempRoot.TrimEnd('\', '/') +
                    [IO.Path]::DirectorySeparatorChar
                  if (-not $runnerWfpObserverRoot.StartsWith(
                      $observerContainmentRoot, [StringComparison]::OrdinalIgnoreCase)) {
                    $runnerWfpObserverStatus = 'path_invalid'
                    $runnerWfpObserverMarkerState = 'path_invalid'
                  } elseif (Test-Path -LiteralPath $runnerWfpObserverRoot) {
                    $runnerWfpObserverStatus = 'path_collision'
                    $runnerWfpObserverMarkerState = 'path_collision'
                  } else {
                    [IO.Directory]::CreateDirectory($runnerWfpObserverRoot) | Out-Null
                    $observerTempOverride = $runnerWfpObserverRoot +
                      [IO.Path]::DirectorySeparatorChar
                    # The helper binds leaf names to the validated profile suffix.
                    $observerToken = $runnerTargetContext.profile_name.Substring(6)
                    $runnerWfpObserverReadyPath = Join-Path $runnerWfpObserverRoot "wfp-$observerToken.ready"
                    $runnerWfpObserverStopPath = Join-Path $runnerWfpObserverRoot "wfp-$observerToken.stop"
                    $runnerWfpObserverResultPath = Join-Path $runnerWfpObserverRoot "wfp-$observerToken.json"
                    $observerStartInfo = [Diagnostics.ProcessStartInfo]::new()
                    $observerStartInfo.FileName = $probeExecutable
                    $observerStartInfo.UseShellExecute = $false
                    $observerStartInfo.CreateNoWindow = $true
                    $observerStartInfo.Environment['TMP'] = $observerTempOverride
                    $observerStartInfo.Environment['TEMP'] = $observerTempOverride
                    foreach ($argument in @(
                      '--collect-ipv6-loopback-wait-profile',
                      [string]$runnerTargetContext.profile_name,
                      [string]$runnerTargetContext.remote_port,
                      $runnerWfpObserverReadyPath,
                      $runnerWfpObserverStopPath,
                      $runnerWfpObserverResultPath
                    )) {
                      [void]$observerStartInfo.ArgumentList.Add([string]$argument)
                    }
                    $runnerWfpObserverProcess = [Diagnostics.Process]::new()
                    $runnerWfpObserverProcess.StartInfo = $observerStartInfo
                    if (-not $runnerWfpObserverProcess.Start()) {
                      $runnerWfpObserverStatus = 'start_failed'
                      $runnerWfpObserverMarkerState = 'start_failed'
                      $runnerWfpObserverProcessState = 'start_failed'
                      $runnerWfpObserverProcess.Dispose()
                      $runnerWfpObserverProcess = $null
                    } else {
                      $runnerWfpObserverMarkerState = 'waiting'
                      $runnerWfpObserverProcessState = 'running'
                      $observerReadyDeadline = [DateTimeOffset]::UtcNow.AddSeconds(15)
                      while ([DateTimeOffset]::UtcNow -lt $observerReadyDeadline) {
                        $runnerWfpObserverProcess.Refresh()
                        if ((Test-Path -LiteralPath $runnerWfpObserverReadyPath -PathType Leaf) -or
                            $runnerWfpObserverProcess.HasExited) {
                          break
                        }
                        Start-Sleep -Milliseconds 25
                      }
                      $runnerWfpObserverStatus = 'unavailable'
                      if (Test-Path -LiteralPath $runnerWfpObserverReadyPath -PathType Leaf) {
                        try {
                          if ((Get-Item -LiteralPath $runnerWfpObserverReadyPath).Length -gt 64) {
                            $runnerWfpObserverMarkerState = 'oversize'
                          } else {
                            $observerMarker = [IO.File]::ReadAllText($runnerWfpObserverReadyPath)
                            $runnerWfpObserverMarkerState = switch -Exact -CaseSensitive ($observerMarker) {
                              "subscription-ready`n" { 'ready' }
                              "sid-derive-failed`n" { 'sid_derive_failed' }
                              "engine-open-failed`n" { 'engine_open_failed' }
                              "subscribe-failed`n" { 'subscribe_failed' }
                              "classify-subscribe-failed`n" { 'classify_subscribe_failed' }
                              default { 'unrecognized' }
                            }
                          }
                        } catch {
                          $runnerWfpObserverMarkerState = 'read_failed'
                        }
                      } elseif ($runnerWfpObserverProcess.HasExited) {
                        $runnerWfpObserverMarkerState = 'helper_exited_before_marker'
                      } else {
                        $runnerWfpObserverMarkerState = 'missing_timeout'
                      }
                      $runnerWfpObserverStatus = switch ($runnerWfpObserverMarkerState) {
                        'ready' { 'ready' }
                        'sid_derive_failed' { 'sid_derive_failed' }
                        'engine_open_failed' { 'engine_open_failed' }
                        'subscribe_failed' { 'subscribe_failed' }
                        default { 'unavailable' }
                      }
                    }
                  }
                }
              } catch {
                $runnerWfpObserverStatus = 'unavailable'
                $runnerWfpObserverMarkerState = 'setup_error'
              }
            } else {
              $runnerWfpObserverStatus = 'target_unavailable'
              $runnerWfpObserverMarkerState = 'target_unavailable'
            }
            if (-not (Test-Path -LiteralPath $wfpRunnerReadyFile)) {
              $observerGateMarker = if ($runnerWfpObserverStatus -eq 'ready') {
                "ready`n"
              } else {
                "unavailable`n"
              }
              [IO.File]::WriteAllText(
                $wfpRunnerReadyFile, $observerGateMarker, [Text.Encoding]::ASCII
              )
            } else {
              $runnerWfpObserverStatus = 'gate_collision'
              $runnerWfpObserverMarkerState = 'gate_collision'
            }

            if (-not $process.WaitForExit(65000)) {
              $process.Refresh()
              if (-not $process.HasExited) {
                Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
                [void]$process.WaitForExit(5000)
              }
              throw 'reviewer_snapshot_probe_capture_window_timeout'
            }
            $process.Refresh()
            if (Test-Path -LiteralPath $stdout) { Get-Content -LiteralPath $stdout }
            if (Test-Path -LiteralPath $stderr) { Get-Content -LiteralPath $stderr }
            if ($process.ExitCode -ne 0) {
              throw "Reviewer snapshot native probe failed exit=$($process.ExitCode)"
            }
          }
          finally {
            if ($runnerWfpObserverProcess) {
              $runnerWfpCleanupState = 'passed'
              try {
                $runnerWfpObserverProcess.Refresh()
                if (-not $runnerWfpObserverProcess.HasExited) {
                  [IO.File]::WriteAllText(
                    $runnerWfpObserverStopPath, "stop`n", [Text.Encoding]::ASCII
                  )
                  if (-not $runnerWfpObserverProcess.WaitForExit(5000)) {
                    try { $runnerWfpObserverProcess.Kill() } catch { }
                    if (-not $runnerWfpObserverProcess.WaitForExit(2000)) {
                      $runnerWfpCleanupState = 'failed'
                    }
                  }
                }
                $runnerWfpObserverProcess.Refresh()
                if (-not $runnerWfpObserverProcess.HasExited) {
                  $runnerWfpCleanupState = 'failed'
                }
                if ($runnerWfpObserverProcess.HasExited) {
                  try {
                    $observerExitCode = [int64]$runnerWfpObserverProcess.ExitCode
                    if ($observerExitCode -eq 0) {
                      $runnerWfpObserverProcessState = 'exit_zero'
                      $runnerWfpObserverHelperExitCode = '0'
                    } else {
                      $runnerWfpObserverProcessState = 'nonzero_exit'
                      $runnerWfpObserverHelperExitCode = if (
                        $observerExitCode -ge 0 -and $observerExitCode -le 65535
                      ) { [string]$observerExitCode } else { 'out_of_range' }
                    }
                    $runnerWfpObserverPreflightState = switch ($observerExitCode) {
                      12 { 'invalid_arguments' }
                      13 { 'invalid_profile_name' }
                      14 { 'invalid_port' }
                      15 { 'invalid_paths' }
                      16 { 'path_full_path_failed' }
                      17 { 'path_leaf_name_mismatch' }
                      18 { 'path_temp_root_rejected' }
                      19 { 'path_parent_mismatch' }
                      20 { 'path_destination_not_missing' }
                      default { 'not_preflight_failure' }
                    }
                  } catch {
                    $runnerWfpObserverProcessState = 'exit_unknown'
                    $runnerWfpObserverHelperExitCode = 'unavailable'
                    $runnerWfpObserverPreflightState = 'unavailable'
                  }
                } else {
                  $runnerWfpObserverProcessState = 'running'
                  $runnerWfpObserverHelperExitCode = 'not_exited'
                  $runnerWfpObserverPreflightState = 'not_exited'
                }

                if (-not (Test-Path -LiteralPath $runnerWfpObserverResultPath -PathType Leaf)) {
                  $runnerWfpReceiptState = 'missing'
                  $runnerWfpCandidateEvent = 'receipt_unavailable'
                } elseif ((Get-Item -LiteralPath $runnerWfpObserverResultPath).Length -gt 4096) {
                  $runnerWfpReceiptState = 'oversize'
                  $runnerWfpCandidateEvent = 'receipt_unavailable'
                } elseif ($runnerWfpObserverProcessState -eq 'running') {
                  $runnerWfpReceiptState = 'process_running'
                  $runnerWfpCandidateEvent = 'receipt_unavailable'
                } elseif ($runnerWfpObserverProcessState -ne 'exit_zero') {
                  $runnerWfpReceiptState = 'helper_nonzero'
                  $runnerWfpCandidateEvent = 'receipt_unavailable'
                } elseif ($runnerWfpCleanupState -ne 'passed') {
                  $runnerWfpReceiptState = 'cleanup_failed'
                  $runnerWfpCandidateEvent = 'receipt_unavailable'
                } else {
                  $observerReceiptText = $null
                  try {
                    $observerReceiptText = [IO.File]::ReadAllText($runnerWfpObserverResultPath)
                  } catch {
                    $runnerWfpReceiptState = 'read_failed'
                  }
                  if ($runnerWfpReceiptState -ne 'read_failed') {
                    try {
                      $observerReceipt = ConvertFrom-Json -InputObject $observerReceiptText -ErrorAction Stop
                      $runnerWfpReceiptState = 'parsed'
                    } catch {
                      $runnerWfpReceiptState = 'invalid_json'
                    }
                  }
                  if ($runnerWfpReceiptState -eq 'read_failed' -or
                      $runnerWfpReceiptState -eq 'invalid_json') {
                    $runnerWfpCandidateEvent = 'receipt_invalid'
                  } else {
                    try {
                      $observerSchema = $observerReceipt.schema_version
                      $observerIpVersion = $observerReceipt.target_ip_version
                      $observerSubscriptionCode = $observerReceipt.subscription_return_code
                      $observerCallbackCount = $observerReceipt.event_callback_count
                      $observerCapabilityCount = $observerReceipt.capability_drop_event_count
                      $observerClassifyCount = $observerReceipt.classify_drop_event_count
                      $observerMatchedCapabilityCount = $observerReceipt.matched_capability_drop_count
                      $observerMatchedClassifyCount = $observerReceipt.matched_classify_drop_count
                      $observerCapabilityId = $observerReceipt.matched_network_capability_id
                      $observerHistoryWindowValid = $observerReceipt.history_time_window_valid
                      $observerHistoryFieldsValid = (
                        $null -eq $observerHistoryWindowValid -or
                        $observerHistoryWindowValid -is [bool]
                      )
                      $observerHistoryStatuses = @(
                        'not_attempted', 'complete', 'limit_reached', 'api_error',
                        'invalid_data', 'invalid_window', 'collection_disabled', 'unavailable'
                      )
                      $observerHistoryStages = @('none', 'create', 'enumerate', 'destroy')
                      foreach ($historyKind in @('capability', 'classify')) {
                        $historyStatusProperty = "history_${historyKind}_status"
                        $historyStageProperty = "history_${historyKind}_api_stage"
                        $historyCodeProperty = "history_${historyKind}_api_code"
                        $historyReturnedProperty = "history_${historyKind}_returned_count"
                        $historyMatchedProperty = "history_${historyKind}_matched_count"
                        $historyStatus = [string]$observerReceipt.$historyStatusProperty
                        $historyStage = [string]$observerReceipt.$historyStageProperty
                        $historyApiCode = $observerReceipt.$historyCodeProperty
                        $historyReturnedCount = $observerReceipt.$historyReturnedProperty
                        $historyMatchedCount = $observerReceipt.$historyMatchedProperty
                        if ($observerHistoryStatuses -notcontains $historyStatus -or
                            $observerHistoryStages -notcontains $historyStage -or
                            (-not ($historyReturnedCount -is [int] -or $historyReturnedCount -is [long])) -or
                            $historyReturnedCount -lt 0 -or $historyReturnedCount -gt 64 -or
                            (-not ($historyMatchedCount -is [int] -or $historyMatchedCount -is [long])) -or
                            $historyMatchedCount -lt 0 -or $historyMatchedCount -gt $historyReturnedCount) {
                          $observerHistoryFieldsValid = $false
                        }
                        if ($historyStatus -eq 'api_error') {
                          if ($observerHistoryStages -notcontains $historyStage -or
                              $historyStage -eq 'none' -or
                              (-not ($historyApiCode -is [int] -or $historyApiCode -is [long])) -or
                              $historyApiCode -lt 0 -or $historyApiCode -gt 4294967295) {
                            $observerHistoryFieldsValid = $false
                          }
                        } elseif ($null -ne $historyApiCode -or $historyStage -ne 'none') {
                          $observerHistoryFieldsValid = $false
                        }
                        if (($historyStatus -eq 'limit_reached' -and $historyReturnedCount -ne 64) -or
                            ($historyStatus -eq 'complete' -and $historyReturnedCount -ge 64) -or
                            ($historyStatus -eq 'invalid_window' -and $observerHistoryWindowValid -ne $false)) {
                          $observerHistoryFieldsValid = $false
                        }
                      }
                      if ($observerHistoryFieldsValid) {
                        $runnerWfpHistoryCapability = '{0}/{1}/{2}' -f `
                          $observerReceipt.history_capability_status, `
                          $observerReceipt.history_capability_returned_count, `
                          $observerReceipt.history_capability_matched_count
                        $runnerWfpHistoryClassify = '{0}/{1}/{2}' -f `
                          $observerReceipt.history_classify_status, `
                          $observerReceipt.history_classify_returned_count, `
                          $observerReceipt.history_classify_matched_count
                      } else {
                        $runnerWfpHistoryCapability = 'invalid'
                        $runnerWfpHistoryClassify = 'invalid'
                      }
                      $observerCountsValid = $true
                      foreach ($count in @(
                        $observerCallbackCount, $observerCapabilityCount,
                        $observerClassifyCount, $observerMatchedCapabilityCount,
                        $observerMatchedClassifyCount
                      )) {
                        if ((-not ($count -is [int] -or $count -is [long])) -or
                            $count -lt 0 -or $count -gt 65535) {
                          $observerCountsValid = $false
                        }
                      }
                      $observerNetworkEventsCollected = $observerReceipt.network_events_collected
                      $observerSubscriptionValid = (
                        $observerReceipt.subscription_attempted -is [bool] -and
                        $observerReceipt.subscription_attempted -and
                        ($observerSubscriptionCode -is [int] -or
                         $observerSubscriptionCode -is [long]) -and
                        $observerSubscriptionCode -eq 0 -and
                        $observerReceipt.subscription_handle_present -is [bool] -and
                        $observerReceipt.subscription_handle_present -and
                        $observerReceipt.subscription_ok -is [bool] -and
                        $observerReceipt.subscription_ok -and
                        $observerReceipt.unsubscribe_ok -is [bool] -and
                        $observerReceipt.unsubscribe_ok -and
                        $observerReceipt.capability_subscription_attempted -is [bool] -and
                        $observerReceipt.capability_subscription_attempted -and
                        ($observerReceipt.capability_subscription_return_code -is [int] -or
                         $observerReceipt.capability_subscription_return_code -is [long]) -and
                        $observerReceipt.capability_subscription_return_code -eq 0 -and
                        $observerReceipt.capability_subscription_handle_present -is [bool] -and
                        $observerReceipt.capability_subscription_handle_present -and
                        $observerReceipt.capability_subscription_ok -is [bool] -and
                        $observerReceipt.capability_subscription_ok -and
                        $observerReceipt.capability_unsubscribe_ok -is [bool] -and
                        $observerReceipt.capability_unsubscribe_ok -and
                        $observerReceipt.classify_subscription_attempted -is [bool] -and
                        $observerReceipt.classify_subscription_attempted -and
                        ($observerReceipt.classify_subscription_return_code -is [int] -or
                         $observerReceipt.classify_subscription_return_code -is [long]) -and
                        $observerReceipt.classify_subscription_return_code -eq 0 -and
                        $observerReceipt.classify_subscription_handle_present -is [bool] -and
                        $observerReceipt.classify_subscription_handle_present -and
                        $observerReceipt.classify_subscription_ok -is [bool] -and
                        $observerReceipt.classify_subscription_ok -and
                        $observerReceipt.classify_unsubscribe_ok -is [bool] -and
                        $observerReceipt.classify_unsubscribe_ok
                      )
                      $observerTargetValid = (
                        $observerSchema -eq 8 -and $observerIpVersion -eq 6 -and
                        $observerReceipt.target_is_loopback -is [bool] -and
                        $observerReceipt.target_is_loopback
                      )
                      $observerMatchesValid = (
                        $observerCountsValid -and
                        $observerCallbackCount -eq ($observerCapabilityCount + $observerClassifyCount) -and
                        $observerMatchedCapabilityCount -le $observerCapabilityCount -and
                        $observerMatchedClassifyCount -le $observerClassifyCount -and
                        $observerReceipt.network_capability_id_consistent -is [bool]
                      )
                      if ($observerMatchedCapabilityCount -gt 0) {
                        $observerMatchesValid = $observerMatchesValid -and
                          $observerReceipt.network_capability_id_consistent -and
                          ($observerCapabilityId -is [int] -or
                           $observerCapabilityId -is [long]) -and
                          $observerCapabilityId -ge 0 -and $observerCapabilityId -le 2
                      } elseif ($null -ne $observerCapabilityId) {
                        $observerMatchesValid = $false
                      }
                      if ($observerSubscriptionValid -and $observerTargetValid -and
                          $observerMatchesValid -and $observerHistoryFieldsValid -and
                          ($null -eq $observerNetworkEventsCollected -or
                           $observerNetworkEventsCollected -is [bool])) {
                        $runnerWfpReceiptState = 'valid'
                        if ($observerNetworkEventsCollected -is [bool]) {
                          $runnerWfpCollectionState = if ($observerNetworkEventsCollected) {
                            'enabled'
                          } else {
                            'disabled'
                          }
                        }
                        $runnerWfpMatchedCapabilityDropCount = [string]$observerMatchedCapabilityCount
                        $runnerWfpMatchedClassifyDropCount = [string]$observerMatchedClassifyCount
                        if ($observerNetworkEventsCollected -eq $false) {
                          $runnerWfpCandidateEvent = 'collection_disabled'
                        } elseif ($null -eq $observerNetworkEventsCollected) {
                          $runnerWfpCandidateEvent = 'collection_unknown'
                        } elseif ($observerMatchedCapabilityCount -gt 0) {
                          $runnerWfpCandidateEvent = 'capability_drop_matched'
                        } elseif ($observerMatchedClassifyCount -gt 0) {
                          $runnerWfpCandidateEvent = 'classify_drop_matched'
                        } else {
                          $runnerWfpCandidateEvent = 'no_matching_event'
                        }
                      } else {
                        $runnerWfpReceiptState = 'invalid_fields'
                        $runnerWfpCandidateEvent = 'receipt_invalid'
                      }
                    } catch {
                      $runnerWfpReceiptState = 'processing_error'
                      $runnerWfpCandidateEvent = 'receipt_invalid'
                    }
                  }
                }
              } catch {
                $runnerWfpCleanupState = 'failed'
                $runnerWfpReceiptState = 'processing_error'
                $runnerWfpCandidateEvent = 'cleanup_or_receipt_error'
              } finally {
                try { $runnerWfpObserverProcess.Dispose() } catch { }
                $runnerWfpObserverProcess = $null
              }
            } elseif ($runnerWfpObserverRoot) {
              $runnerWfpCleanupState = 'not_started'
            }
            if ($runnerWfpObserverRoot -and
                (Test-Path -LiteralPath $runnerWfpObserverRoot -PathType Container)) {
              try {
                Remove-Item -LiteralPath $runnerWfpObserverRoot -Recurse -Force -ErrorAction Stop
              } catch {
                $runnerWfpCleanupState = 'failed'
              }
            }
            if ($wfpCaptureStartAttempted -and -not $wfpCaptureStarted -and
                ($wfpCaptureStatus -eq 'start_timeout' -or
                 $wfpCaptureStatus -eq 'start_failed')) {
              $captureRecoveryStatus = Invoke-BoundedDiagnosticCommand `
                -Path $netsh -Arguments @('wfp', 'capture', 'status') `
                -TimeoutMilliseconds 5000 -CaptureStdout -CaptureStderr
              if ($captureRecoveryStatus.TimedOut -or $captureRecoveryStatus.ExitCode -ne 0) {
                $wfpCaptureStatus = 'start_state_unknown'
              } else {
                $captureRecoveryOutput = $captureRecoveryStatus.Stdout + "`n" + $captureRecoveryStatus.Stderr
                $captureRecoveryActivity = Get-WfpCaptureActivity $captureRecoveryOutput
                $captureRecoveryOwnsSession = [regex]::IsMatch(
                  $captureRecoveryOutput,
                  [regex]::Escape($wfpCapturePrefix),
                  [Text.RegularExpressions.RegexOptions]::IgnoreCase
                )
                if ($captureRecoveryActivity -eq 'active' -and $captureRecoveryOwnsSession) {
                  $wfpCaptureStarted = $true
                  $wfpCaptureStatus = 'start_recovered'
                } elseif ($captureRecoveryActivity -eq 'active') {
                  $wfpCaptureStatus = 'start_state_unowned'
                } elseif ($captureRecoveryActivity -eq 'inactive') {
                  $wfpCaptureStatus = 'start_not_active'
                } else {
                  $wfpCaptureStatus = 'start_state_unknown'
                }
              }
            }
            if ($wfpCaptureStarted) {
              try {
                $captureStopResult = Invoke-BoundedDiagnosticCommand `
                  -Path $netsh -Arguments @('wfp', 'capture', 'stop') `
                  -TimeoutMilliseconds 10000
                if (-not $captureStopResult.TimedOut -and $captureStopResult.ExitCode -eq 0) {
                  $wfpCaptureStatus = 'stopped'
                  if (Test-Path -LiteralPath $wfpCaptureArchive -PathType Leaf) {
                    $archiveLength = (Get-Item -LiteralPath $wfpCaptureArchive).Length
                    if ($archiveLength -gt 67108864) {
                      $wfpCaptureStatus = 'archive_too_large'
                    } else {
                      $expand = Join-Path $env:SystemRoot 'System32/expand.exe'
                      $wfpXmlCandidates = @()
                      $memberListResult = Invoke-BoundedDiagnosticCommand `
                        -Path $python -Arguments @(
                          $cabinetMemberProbe, '--archive', $wfpCaptureArchive
                        ) -TimeoutMilliseconds 5000 -CaptureStdout
                      if ($memberListResult.TimedOut) {
                        $wfpArchiveMemberStatus = 'list_timeout'
                        $wfpCaptureStatus = 'member_list_timeout'
                      } elseif ($memberListResult.ExitCode -ne 0) {
                        $wfpArchiveMemberStatus = 'list_failed'
                        $wfpCaptureStatus = 'member_list_failed'
                      } else {
                        $cabinetSummaryValid = $false
                        try {
                          $cabinetMemberSummary = $memberListResult.Stdout | ConvertFrom-Json
                          $summaryPropertyNames = @(
                            $cabinetMemberSummary.PSObject.Properties.Name | Sort-Object
                          )
                          $expectedSummaryPropertyNames = @(
                            'member_count', 'schema_version', 'status', 'target_match_count',
                            'xml_member_count', 'wfpdiag_prefixed_xml_member_count'
                          )
                          $cabinetSummaryValid = (
                            $summaryPropertyNames.Count -eq $expectedSummaryPropertyNames.Count
                          )
                          foreach ($expectedPropertyName in $expectedSummaryPropertyNames) {
                            if ($summaryPropertyNames -notcontains $expectedPropertyName) {
                              $cabinetSummaryValid = $false
                            }
                          }
                          if ($cabinetSummaryValid) {
                            $cabinetSummaryValid = (
                              $cabinetMemberSummary.schema_version -eq 3 -and
                              ($cabinetMemberSummary.member_count -is [int] -or
                               $cabinetMemberSummary.member_count -is [long]) -and
                              $cabinetMemberSummary.member_count -ge 0 -and
                              $cabinetMemberSummary.member_count -le 4096 -and
                              ($cabinetMemberSummary.target_match_count -is [int] -or
                               $cabinetMemberSummary.target_match_count -is [long]) -and
                              $cabinetMemberSummary.target_match_count -ge 0 -and
                              $cabinetMemberSummary.target_match_count -le $cabinetMemberSummary.member_count -and
                              ($cabinetMemberSummary.xml_member_count -is [int] -or
                               $cabinetMemberSummary.xml_member_count -is [long]) -and
                              $cabinetMemberSummary.xml_member_count -ge 0 -and
                              $cabinetMemberSummary.xml_member_count -le 4096 -and
                              $cabinetMemberSummary.xml_member_count -le $cabinetMemberSummary.member_count -and
                              $cabinetMemberSummary.target_match_count -le $cabinetMemberSummary.xml_member_count -and
                              ($cabinetMemberSummary.wfpdiag_prefixed_xml_member_count -is [int] -or
                               $cabinetMemberSummary.wfpdiag_prefixed_xml_member_count -is [long]) -and
                              $cabinetMemberSummary.wfpdiag_prefixed_xml_member_count -ge 0 -and
                              $cabinetMemberSummary.wfpdiag_prefixed_xml_member_count -le 4096 -and
                              $cabinetMemberSummary.wfpdiag_prefixed_xml_member_count -le $cabinetMemberSummary.xml_member_count -and
                              $cabinetMemberSummary.target_match_count -le $cabinetMemberSummary.wfpdiag_prefixed_xml_member_count
                            )
                          }
                        } catch {
                          $cabinetSummaryValid = $false
                        }
                        if ($cabinetSummaryValid) {
                          $wfpArchiveMemberCount = [string]$cabinetMemberSummary.member_count
                          $wfpArchiveXmlMemberCount = [string]$cabinetMemberSummary.xml_member_count
                          $wfpArchiveWfpdiagXmlMemberCount = [string]$cabinetMemberSummary.wfpdiag_prefixed_xml_member_count
                        }
                        if (-not $cabinetSummaryValid) {
                          $wfpArchiveMemberStatus = 'summary_invalid'
                          $wfpCaptureStatus = 'member_list_failed'
                        } elseif ($cabinetMemberSummary.status -cne 'listed') {
                          $wfpArchiveMemberStatus = 'list_failed'
                          $wfpCaptureStatus = 'member_list_failed'
                        } else {
                          $matchCount = [long]$cabinetMemberSummary.target_match_count
                          $wfpArchiveMemberMatchCount = if ($matchCount -eq 0) {
                            'zero'
                          } elseif ($matchCount -eq 1) {
                            'one'
                          } else {
                            'multiple'
                          }
                          if ($matchCount -eq 0) {
                            $wfpArchiveMemberStatus = 'missing'
                            $wfpCaptureStatus = 'archive_member_missing'
                          } elseif ($matchCount -gt 1) {
                            $wfpArchiveMemberStatus = 'multiple'
                            $wfpCaptureStatus = 'archive_member_ambiguous'
                          } else {
                            $wfpArchiveMemberStatus = 'present'
                            $wfpCaptureStatus = 'extracting'
                            New-Item -ItemType Directory -Path $wfpExtractRoot | Out-Null
                            $expandArguments = if ($wfpMemberSelfTestExtractMode -eq 'file') {
                              @($wfpCaptureArchive, '-F:wfpdiag.xml', $wfpExtractExplicitFile)
                            } else {
                              @($wfpCaptureArchive, '-F:wfpdiag.xml', $wfpExtractRoot)
                            }
                            $expandResult = Invoke-BoundedDiagnosticCommand `
                              -Path $expand -Arguments $expandArguments -TimeoutMilliseconds 15000
                            if ($null -eq $expandResult.ExitCode) {
                              $wfpExtractExitCode = 'unknown'
                            } else {
                              $wfpExtractExitCode = [string]$expandResult.ExitCode
                            }
                            if ($expandResult.TimedOut) {
                              $wfpCaptureStatus = 'extract_timeout'
                            } elseif ($expandResult.ExitCode -ne 0) {
                              $wfpCaptureStatus = 'extract_command_failed'
                            } elseif ($wfpMemberSelfTestExtractMode -eq 'file') {
                              if (Test-Path -LiteralPath $wfpExtractExplicitFile -PathType Leaf) {
                                $wfpXmlCandidates = @(
                                  Get-Item -LiteralPath $wfpExtractExplicitFile -ErrorAction Stop
                                )
                              }
                            } else {
                              $wfpXmlCandidates = @(
                                Get-ChildItem -LiteralPath $wfpExtractRoot `
                                  -Filter 'wfpdiag.xml' -File -Recurse -Force -ErrorAction Stop
                              )
                            }
                          }
                        }
                      }
                      if ($wfpCaptureStatus -eq 'extracting') {
                        if ($wfpXmlCandidates.Count -eq 0) {
                          $wfpCaptureStatus = 'extract_xml_missing'
                        } elseif ($wfpXmlCandidates.Count -gt 1) {
                          $wfpCaptureStatus = 'extract_xml_ambiguous'
                        } elseif ($wfpXmlCandidates[0].Length -gt 8388608) {
                          $wfpCaptureStatus = 'extract_xml_too_large'
                        } else {
                          $wfpXml = $wfpXmlCandidates[0].FullName
                          $captureSummaryResult = Invoke-BoundedDiagnosticCommand `
                            -Path $python -Arguments @(
                              (Join-Path $env:GITHUB_WORKSPACE 'scripts/inspect_windows_wfp_capture.py'),
                              '--xml', $wfpXml, '--context', $wfpMatchFile
                            ) -TimeoutMilliseconds 10000 -CaptureStdout
                          if (-not $captureSummaryResult.TimedOut -and
                              $captureSummaryResult.ExitCode -eq 0) {
                            try {
                              $parsedCaptureSummary = $captureSummaryResult.Stdout | ConvertFrom-Json
                              $parsedCount = $parsedCaptureSummary.exact_classify_drop_count
                              if ($parsedCaptureSummary.status -in @('matched', 'no_match', 'inconclusive') -and
                                  ($parsedCount -is [int] -or $parsedCount -is [long]) -and
                                  $parsedCount -ge 0 -and $parsedCount -le 8192) {
                                $wfpCaptureStatus = [string]$parsedCaptureSummary.status
                                $wfpExactDropCount = $parsedCount
                              } else {
                                $wfpCaptureStatus = 'parser_failed'
                              }
                            } catch {
                              $wfpCaptureStatus = 'parser_failed'
                            }
                          } else {
                            $wfpCaptureStatus = 'parser_failed'
                          }
                        }
                      }
                    }
                  } else {
                    $wfpCaptureStatus = 'archive_missing'
                  }
                } else {
                  $wfpCaptureStatus = if ($captureStopResult.TimedOut) {
                    'stop_timeout'
                  } else {
                    'stop_failed'
                  }
                }
              } catch {
                $wfpCaptureStatus = 'capture_error'
              }
            }
            foreach ($diagnosticPath in @(
              $wfpCaptureArchive, $wfpCapturePrefix, $wfpExtractRoot
            )) {
              if (Test-Path -LiteralPath $diagnosticPath) {
                try {
                  Remove-Item -LiteralPath $diagnosticPath -Recurse -Force -ErrorAction Stop
                } catch {
                  $wfpCaptureStatus = 'cleanup_failed'
                }
              }
            }
            Write-Output '::group::Windows WFP supplemental capture states'
            Write-Output "observer_preflight=$runnerWfpObserverPreflightState capture_preflight=$wfpCapturePreflight archive_member_match_count=$wfpArchiveMemberMatchCount"
            Write-Output "observer_matched_classify_drops=$runnerWfpMatchedClassifyDropCount matched_capability_drops=$runnerWfpMatchedCapabilityDropCount history_capability=$runnerWfpHistoryCapability history_classify=$runnerWfpHistoryClassify"
            Write-Output "capture_status=$wfpCaptureStatus exact_classify_drop_count=$wfpExactDropCount extract_exit_code=$wfpExtractExitCode cab_status=$wfpArchiveMemberStatus cab_members=$wfpArchiveMemberCount xml_members=$wfpArchiveXmlMemberCount wfpdiag_xml_members=$wfpArchiveWfpdiagXmlMemberCount"
            Write-Output '::endgroup::'
            Write-Output "::notice title=Windows WFP capture and runner observer::target_context=$runnerWfpTargetContextState observer=$runnerWfpObserverStatus collection=$runnerWfpCollectionState event=$runnerWfpCandidateEvent cap_drop=$runnerWfpMatchedCapabilityDropCount hist_cap=$runnerWfpHistoryCapability hist_cls=$runnerWfpHistoryClassify cleanup=$runnerWfpCleanupState marker=$runnerWfpObserverMarkerState process=$runnerWfpObserverProcessState helper_rc=$runnerWfpObserverHelperExitCode receipt=$runnerWfpReceiptState capture=$wfpCaptureStatus"
            foreach ($name in $environmentNames) {
              [Environment]::SetEnvironmentVariable($name, $savedEnvironment[$name], 'Process')
            }
            if ($created) {
              Remove-LocalUser -Name $accountName -ErrorAction Stop
              if (Get-LocalUser -Name $accountName -ErrorAction SilentlyContinue) {
                throw 'temporary_reviewer_account_cleanup_failed'
              }
            }
            if (Test-Path -LiteralPath $probeRoot) {
              Remove-Item -LiteralPath $probeRoot -Recurse -Force -ErrorAction Stop
            }
            if ($securePassword) { $securePassword.Dispose() }
            $passwordText = $null
            if ($runnerWfpCleanupState -eq 'failed') {
              throw 'runner_wfp_candidate_observer_cleanup_failed'
            }
          }

  windows-appcontainer-read-handle-probe:
    if: github.event_name == 'workflow_dispatch' && inputs.run_windows_appcontainer_read_handle_probe
    name: R2 Windows AppContainer read-handle probe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cmake-architecture: x64
          - os: windows-11-arm
            cmake-architecture: ARM64
    env:
      PYTHONPATH: src
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Build native AppContainer read-handle and private-network probes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $buildDirectory = Join-Path $env:RUNNER_TEMP 'icode-appcontainer-read-probe'
          cmake -S native/windows -B $buildDirectory -A '${{ matrix.cmake-architecture }}'
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed: $LASTEXITCODE" }
          cmake --build $buildDirectory --config Release --parallel 1
          if ($LASTEXITCODE -ne 0) { throw "Native probe build failed: $LASTEXITCODE" }
          $probe = Join-Path $buildDirectory 'Release/icode-appcontainer-read-probe.exe'
          $wfpProbe = Join-Path $buildDirectory 'Release/icode-wfp-event-probe.exe'
          & $probe --self-test-network-target
          if ($LASTEXITCODE -ne 0) { throw "Private-network target parser self-test failed: $LASTEXITCODE" }
          & $wfpProbe --self-test
          if ($LASTEXITCODE -ne 0) { throw "WFP event classifier self-test failed: $LASTEXITCODE" }
          python scripts/run_windows_appcontainer_read_probe.py $probe $wfpProbe
          if ($LASTEXITCODE -ne 0) { throw "AppContainer read-handle probe failed: $LASTEXITCODE" }

  windows-standard-user-token-probe:
    if: github.event_name == 'workflow_dispatch' && inputs.run_windows_standard_user_token_probe
    name: Standard-user restricted token probe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python-architecture: x64
          - os: windows-11-arm
            python-architecture: arm64
    env:
      ICODE_R2_SQOS_DIAGNOSTIC: ${{ inputs.run_windows_standard_user_sqos_diagnostic }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          architecture: ${{ matrix.python-architecture }}
      - name: Probe fixed restricted-token launch as a temporary standard user
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $suffix = [Guid]::NewGuid().ToString('N').Substring(0, 8)
          $accountName = "icodeprobe_$suffix"
          $missingAccountName = "icodemissing_$suffix"
          if (Get-LocalUser -Name $missingAccountName -ErrorAction SilentlyContinue) {
            throw 'missing_account_probe_name_collision'
          }
          $passwordBytes = [Security.Cryptography.RandomNumberGenerator]::GetBytes(32)
          $passwordText = [Convert]::ToBase64String($passwordBytes).TrimEnd('=') + 'aA1!'
          Write-Output "::add-mask::$passwordText"
          [Array]::Clear($passwordBytes, 0, $passwordBytes.Length)
          $securePassword = ConvertTo-SecureString -String $passwordText -AsPlainText -Force
          $created = $false
          try {
            New-LocalUser -Name $accountName -Password $securePassword `
              -PasswordNeverExpires -AccountNeverExpires | Out-Null
            $created = $true
            $sid = (Get-LocalUser -Name $accountName).SID.Value
            $adminSids = Get-LocalGroupMember -Group 'Administrators' |
              ForEach-Object { $_.SID.Value }
            if ($adminSids -contains $sid) {
              throw 'temporary_probe_account_is_admin'
            }
            $env:ICODE_R2_PROBE_USERNAME = $accountName
            $env:ICODE_R2_PROBE_PASSWORD = $passwordText
            $env:ICODE_R2_PROBE_SID = $sid
            $env:ICODE_R2_PROBE_MISSING_USERNAME = $missingAccountName
            python scripts/windows_standard_user_token_probe.py
            if ($LASTEXITCODE -ne 0) {
              throw "restricted_token_probe_failed exit=$LASTEXITCODE"
            }
          }
          finally {
            Remove-Item Env:ICODE_R2_PROBE_USERNAME -ErrorAction SilentlyContinue
            Remove-Item Env:ICODE_R2_PROBE_PASSWORD -ErrorAction SilentlyContinue
            Remove-Item Env:ICODE_R2_PROBE_SID -ErrorAction SilentlyContinue
            Remove-Item Env:ICODE_R2_PROBE_MISSING_USERNAME -ErrorAction SilentlyContinue
            if ($created) {
              Remove-LocalUser -Name $accountName -ErrorAction Stop
              if (Get-LocalUser -Name $accountName -ErrorAction SilentlyContinue) {
                throw 'temporary_probe_account_cleanup_failed'
              }
            }
            if ($securePassword) { $securePassword.Dispose() }
            $passwordText = $null
          }

  windows-appcontainer-diagnostics:
    if: github.event_name == 'workflow_dispatch' && inputs.run_legacy_appcontainer_diagnostics
    name: Retired AppContainer diagnostics (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    env:
      PYTHONPATH: src
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Emit isolated Python runtime file access diagnostics
        run: python -m unittest tests.test_windows_appcontainer.TestWindowsAppContainer.test_诊断容器对宿主Python运行时文件的直接读取 -v
        continue-on-error: true
      - name: Classify Python runtime reparse targets without following links
        run: python -m unittest tests.test_windows_appcontainer.TestWindowsAppContainer.test_诊断Python运行时重解析目标关系 -v
        env:
          ICODE_DIAGNOSTIC_RUNTIME_REPARSE_INVENTORY: "true"
        continue-on-error: true
      - name: Probe disposable staged Python runtime under AppContainer
        run: python -m unittest tests.test_windows_appcontainer.TestWindowsAppContainer.test_诊断stagedPython运行时可读执行不可写且恢复清理 -v
        env:
          ICODE_DIAGNOSTIC_RUNTIME_STAGING: "true"
      - name: Verify AppContainer workspace, network denial, ACL revocation, and Job composition
        run: python -m unittest tests.test_windows_appcontainer -v

  windows-native-wheel:
