name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_legacy_appcontainer_diagnostics:
        description: Run the retired AppContainer experiments on Windows
        required: false
        default: false
        type: boolean
      run_windows_standard_user_token_probe:
        description: Verify restricted-token process creation from a temporary standard Windows user
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      PYTHONPATH: src
    steps:
      - name: Check out the pinned source and workflow contracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: python -m compileall -q src tests scripts
      - name: Run the full unit test suite
        run: python -m unittest
      - name: Run the delivery guards
        run: python scripts/preflight.py

  workspace-platforms:
    name: R2.1 workspace (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      PYTHONPATH: src
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - name: Check out source and pinned skill
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Verify workspace and autonomous lifecycle
        run: python scripts/run_workspace_ci.py
      - name: Verify Windows R3 snapshot rejects junctions
        if: runner.os == 'Windows'
        run: python -m unittest tests.test_r3_regression.TestWindowsSnapshotReparseSafety -v
      - name: Verify leased TCP socket lifecycle
        run: python scripts/run_network_lease_ci.py

  windows-tree-snapshot-probe:
    name: R3 Windows directory-handle probe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    env:
      PYTHONPATH: src
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Probe bounded directory records and native handle sharing
        run: python -m unittest tests.test_windows_tree_snapshot_probe -v

  native-probe:
    name: R2.2 native probe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, ubuntu-22.04, ubuntu-22.04-arm, macos-latest, macos-15-intel]
    env:
      PYTHONPATH: src
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Verify R3 Reviewer exact-file and hardlink read limits (macOS)
        if: runner.os == 'macOS'
        run: >-
          python -m unittest
          tests.test_tools.TestFileTools.test_精确工作区路径不能读取工作区外文件的硬链接
          tests.test_tools.TestFileTools.test_工具上下文精确读取白名单限制read_file
          tests.test_tools.TestFileTools.test_工具上下文精确读取白名单不扩展为目录grep
          -v
      - name: Diagnose Linux user-namespace host policy
        if: runner.os == 'Linux'
        shell: bash
        run: |
          printf '::notice::linux-userns uid=%s gid=%s apparmor=%s\n' "$(id -u)" "$(id -g)" "$(cat /proc/self/attr/current)"
          if test -r /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            printf '::notice::apparmor_restrict_unprivileged_userns=%s\n' "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)"
          fi
          unshare --user --map-root-user true || true
          if mapless=$(unshare --user --pid --fork sh -c 'printf "pid=%s uid=%s gid=%s\n" "$$" "$(id -u)" "$(id -g)"' 2>&1); then
            printf '::notice::mapless user+PID namespace launched: %s\n' "$mapless"
          else
            printf '::warning::mapless user+PID namespace unavailable: %s\n' "$mapless"
          fi
      - name: Install Bubblewrap for Linux Reviewer probes
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          command -v bwrap
      - name: Load the pinned Bubblewrap AppArmor profile when required
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [[ ! -r /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]] \
            || [[ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" != "1" ]]; then
            echo "::notice::AppArmor user namespace restriction is not enabled"
            exit 0
          fi
          profile_revision='b0eb95457bc2de401920308869d016e696c73664'
          profile_sha256='11d39094f044f0cda0febb3ad517b830301da6b2ce929664af09ee9e4dd264f9'
          profile_path="${RUNNER_TEMP}/bwrap-userns-restrict"
          profile_url="https://gitlab.com/apparmor/apparmor/-/raw/${profile_revision}/profiles/apparmor/profiles/extras/bwrap-userns-restrict"
          curl --fail --location --silent --show-error "${profile_url}" --output "${profile_path}"
          printf '%s  %s\n' "${profile_sha256}" "${profile_path}" | sha256sum --check
          sudo apparmor_parser --replace "${profile_path}"
          active_profiles='/sys/kernel/security/apparmor/profiles'
          if ! sudo grep -Fq 'bwrap (enforce)' "${active_profiles}"; then
            sudo cat "${active_profiles}"
            echo "::error::Pinned bwrap AppArmor profile was not loaded"
            exit 1
          fi
          bwrap_args=(--die-with-parent --unshare-user --ro-bind /usr /usr --ro-bind /bin /bin --ro-bind /lib /lib --proc /proc --dev /dev)
          if [[ -e /lib64 ]]; then
            bwrap_args+=(--ro-bind /lib64 /lib64)
          fi
          child_profile="$(bwrap "${bwrap_args[@]}" -- /bin/cat /proc/self/attr/current)"
          if [[ "${child_profile}" != *unpriv_bwrap* ]]; then
            echo "::error::Bubblewrap child did not enter the restricted AppArmor profile: ${child_profile}"
            exit 1
          fi
      - name: Verify Linux Reviewer ToolContext boundary
        if: runner.os == 'Linux'
        run: python -m unittest tests.test_isolation.TestSandboxWrapping.test_bwrap_只读Reviewer实际隐藏工单账本且阻断所有写入 -v
      - name: Verify Linux read-only Reviewer OS boundary
        if: runner.os == 'Linux'
        run: python -m unittest tests.test_isolation.TestSandboxWrapping.test_bwrap_只读Reviewer真实隐藏账本且阻断工作区内外写入 -v
      - name: Verify mapped and mapless Linux sandbox branches
        if: runner.os == 'Linux'
        run: python -m unittest tests.test_linux_mapless -v
      - name: Run actual native negative probes
        run: python scripts/run_native_probe_ci.py
      - name: Verify test-only seccomp USER_NOTIF receipt prototype
        if: runner.os == 'Linux'
        run: python -m unittest tests.test_seccomp_notify_probe -v
      - name: Verify Linux run_command USER_NOTIF receipt integration
        if: runner.os == 'Linux'
        run: python -m unittest tests.test_linux_violation_receipt -v
      - name: Verify Linux PID namespace host-crash cleanup
        if: runner.os == 'Linux'
        run: python -m unittest tests.test_linux_pidns_cleanup -v
      - name: Verify Linux helper filesystem, network and group-independent cleanup
        if: runner.os == 'Linux'
        run: python -m unittest tests.test_isolation.TestProbe.test_landlock_助手真实阻断文件与网络越权 -v
      - name: Verify policy command broker
        run: python -m unittest tests.test_execution_broker -v
      - name: Verify leased TCP socket lifecycle
        run: python scripts/run_network_lease_ci.py
      - name: Verify protected-path Seatbelt policy
        if: runner.os == 'macOS'
        run: python -m unittest tests.test_isolation.TestSandboxWrapping.test_seatbelt_策略profile真实阻断受保护文件与外部路径 -v
      - name: Observe one controlled Seatbelt violation (diagnostic only)
        if: runner.os == 'macOS'
        run: python -m unittest tests.test_macos_violation_log_probe -v
      - name: Verify minimal Seatbelt denies external private tmp reads
        if: runner.os == 'macOS'
        run: python -m unittest tests.test_isolation.TestSandboxWrapping.test_seatbelt_最小profile不读取private_tmp外部秘密 -v
      - name: Diagnose Seatbelt localhost random-port address scope
        if: runner.os == 'macOS'
        run: python -m unittest tests.test_isolation.TestSandboxWrapping.test_seatbelt_localhost随机端口规则地址范围诊断 -v
      - name: Probe path-scoped Seatbelt AF_UNIX proxy candidate
        if: runner.os == 'macOS'
        run: python -m unittest tests.test_macos_unix_socket_probe -v
      - name: Verify read-only Reviewer hides ticket ledger
        if: runner.os == 'macOS'
        run: python -m unittest tests.test_isolation.TestSandboxWrapping.test_seatbelt_只读Reviewer真实隐藏账本且阻断工作区内外写入 -v
      - name: Verify experimental Seatbelt policy through broker
        if: runner.os == 'macOS'
        run: python -m unittest tests.test_isolation.TestSandboxWrapping.test_seatbelt_实验策略经命令broker执行 -v
      - name: Verify scoped macOS process-group cleanup probe
        if: runner.os == 'macOS'
        run: python -m unittest tests.test_isolation.TestProbe.test_macos_同组清理真实自检不冒充整树 -v
      - name: Verify launchd bootout known cleanup gap
        if: runner.os == 'macOS'
        run: python -m unittest tests.test_isolation.TestSandboxWrapping.test_launchd_独立作业仍未回收脱组后代 -v
      - name: Build and verify installed Linux wheel
        if: runner.os == 'Linux'
        run: python scripts/run_native_wheel_ci.py

  windows-job-probe:
    name: R2.3 Windows Job cleanup probe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    env:
      PYTHONPATH: src
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Verify R3 Reviewer exact-file and hardlink read limits
        run: >-
          python -m unittest
          tests.test_tools.TestFileTools.test_精确工作区路径不能读取工作区外文件的硬链接
          tests.test_tools.TestFileTools.test_工具上下文精确读取白名单限制read_file
          tests.test_tools.TestFileTools.test_工具上下文精确读取白名单不扩展为目录grep
          -v
      - name: Verify normal and timeout descendant cleanup
        run: python -m unittest tests.test_windows_job -v
      - name: Verify leased TCP socket lifecycle
        run: python scripts/run_network_lease_ci.py

  windows-standard-user-token-probe:
    if: github.event_name == 'workflow_dispatch' && inputs.run_windows_standard_user_token_probe
    name: Standard-user restricted token probe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python-architecture: x64
          - os: windows-11-arm
            python-architecture: arm64
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          architecture: ${{ matrix.python-architecture }}
      - name: Probe fixed restricted-token launch as a temporary standard user
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $suffix = [Guid]::NewGuid().ToString('N').Substring(0, 8)
          $accountName = "icodeprobe_$suffix"
          $missingAccountName = "icodemissing_$suffix"
          if (Get-LocalUser -Name $missingAccountName -ErrorAction SilentlyContinue) {
            throw 'missing_account_probe_name_collision'
          }
          $passwordBytes = [Security.Cryptography.RandomNumberGenerator]::GetBytes(32)
          $passwordText = [Convert]::ToBase64String($passwordBytes).TrimEnd('=') + 'aA1!'
          Write-Output "::add-mask::$passwordText"
          [Array]::Clear($passwordBytes, 0, $passwordBytes.Length)
          $securePassword = ConvertTo-SecureString -String $passwordText -AsPlainText -Force
          $created = $false
          try {
            New-LocalUser -Name $accountName -Password $securePassword `
              -PasswordNeverExpires -AccountNeverExpires | Out-Null
            $created = $true
            $sid = (Get-LocalUser -Name $accountName).SID.Value
            $adminSids = Get-LocalGroupMember -Group 'Administrators' |
              ForEach-Object { $_.SID.Value }
            if ($adminSids -contains $sid) {
              throw 'temporary_probe_account_is_admin'
            }
            $env:ICODE_R2_PROBE_USERNAME = $accountName
            $env:ICODE_R2_PROBE_PASSWORD = $passwordText
            $env:ICODE_R2_PROBE_SID = $sid
            $env:ICODE_R2_PROBE_MISSING_USERNAME = $missingAccountName
            python scripts/windows_standard_user_token_probe.py
            if ($LASTEXITCODE -ne 0) {
              throw "restricted_token_probe_failed exit=$LASTEXITCODE"
            }
          }
          finally {
            Remove-Item Env:ICODE_R2_PROBE_USERNAME -ErrorAction SilentlyContinue
            Remove-Item Env:ICODE_R2_PROBE_PASSWORD -ErrorAction SilentlyContinue
            Remove-Item Env:ICODE_R2_PROBE_SID -ErrorAction SilentlyContinue
            Remove-Item Env:ICODE_R2_PROBE_MISSING_USERNAME -ErrorAction SilentlyContinue
            if ($created) {
              Remove-LocalUser -Name $accountName -ErrorAction Stop
              if (Get-LocalUser -Name $accountName -ErrorAction SilentlyContinue) {
                throw 'temporary_probe_account_cleanup_failed'
              }
            }
            if ($securePassword) { $securePassword.Dispose() }
            $passwordText = $null
          }

  windows-appcontainer-diagnostics:
    if: github.event_name == 'workflow_dispatch' && inputs.run_legacy_appcontainer_diagnostics
    name: Retired AppContainer diagnostics (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    env:
      PYTHONPATH: src
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Emit isolated Python runtime file access diagnostics
        run: python -m unittest tests.test_windows_appcontainer.TestWindowsAppContainer.test_诊断容器对宿主Python运行时文件的直接读取 -v
        continue-on-error: true
      - name: Classify Python runtime reparse targets without following links
        run: python -m unittest tests.test_windows_appcontainer.TestWindowsAppContainer.test_诊断Python运行时重解析目标关系 -v
        env:
          ICODE_DIAGNOSTIC_RUNTIME_REPARSE_INVENTORY: "true"
        continue-on-error: true
      - name: Probe disposable staged Python runtime under AppContainer
        run: python -m unittest tests.test_windows_appcontainer.TestWindowsAppContainer.test_诊断stagedPython运行时可读执行不可写且恢复清理 -v
        env:
          ICODE_DIAGNOSTIC_RUNTIME_STAGING: "true"
      - name: Verify AppContainer workspace, network denial, ACL revocation, and Job composition
        run: python -m unittest tests.test_windows_appcontainer -v

  windows-native-wheel:
    name: R2.3 Windows wheel packaging (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Build, inspect and install architecture-specific wheel
        run: python scripts/run_windows_wheel_ci.py

  presentation:
    name: Repository presentation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate website and documentation links
        run: python scripts/check_site.py
      - name: Validate repository governance
        run: python scripts/check_governance.py
      - name: Remind about open-source Agent research freshness
        run: python scripts/check_agent_landscape.py --warn-only
